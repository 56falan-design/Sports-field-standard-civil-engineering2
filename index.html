,{"c":12,"s":"c12-s6","t":"12.6 โครงสร้างทางและการก่อสร้าง","x":"Appendix O ไม่กำหนดโครงสร้างชั้นทาง ส่วนผสมแอสฟัลต์ ความเรียบผิว หรือค่าความต้านทานการลื่นของผิวทาง (อ้างเพียงมาตรฐาน FIA 3503-2019 สำหรับสีและโฆษณาบนพื้นที่ปลอดภัยแบบปู) ผู้ตรวจ FIA อาจขอคำรับรองความแข็งแรงของสิ่งติดตั้งความปลอดภัยจากวิศวกรโครงสร้าง งานชั้นทาง การบดอัด และระบบระบายน้ำต้องออกแบบและตรวจสอบเพิ่มเติมตามบทที่ 2 ร่วมกับมาตรฐานงานทางของประเทศ"},{"c":12,"s":"c12-s7","t":"12.7 การกำกับสนามและอุปกรณ์สัญญาณ (Appendix H 2026)","x":"Appendix H ของ International Sporting Code ฉบับเผยแพร่ 23 มิ.ย. 2026 (Recommendations for the supervision of the road and emergency services) ให้ค่าที่กระทบผังและงานก่อสร้างดังนี้ ข้อ ข้อกำหนด 2.1.2 ห้องควบคุมการแข่งขัน อยู่ในอาคารพิทฝั่งทางเข้าพิท สูงจากพื้นไม่เกินหนึ่งชั้น 2.2 ห้องจับเวลา อยู่ชั้นที่หนึ่งหรือสองเหนือชั้นล่าง (ไม่ใช่ชั้นล่าง) สเปกห้องตาม FIA Timing System Guidelines 2.3.1 ทางพิท จำกัดความเร็วไม่เกิน 60 km/h (ยกเว้น F1 และสนามโอวัล) 2.3.4 จุดมาร์แชลทางพิท ทางเข้า 1 ทางออก 1 และ 1 คนต่อทุก 10 โรงรถตลอดแนวทางพิท 2.4.2 จุดมาร์แชล ห่างกันไม่เกิน 500 m มองเห็นจุดข้างเคียง ทุกช่วงระหว่างแบริเออร์ต้องมีผู้เฝ้า ป้ายจุดกว้าง 40 cm สูง 30 cm เส้นอ้างอิงธงเหลืองกว้าง 10 cm พร้อมหมุดยืดหยุ่นห่างขอบทางประมาณ 1 m 2.4.3 อุปกรณ์ประจำจุด วัสดุดูดซับ 10 L ถังดับเพลิงอย่างน้อย 3 ถัง แต่ละถังหนักรวมไม่เกิน 10 kg และมีสารดับเพลิงไม่น้อยกว่า 6 kg เครื่องเป่าลมอย่างน้อย 380 CFM แรงเป่า 9 N ป้าย SC/FCY ตัวอักษรสูง 40 cm บนพื้นอย่างน้อย 60 × 80 cm 2.5.2 ธง ขั้นต่ำ 60 × 80 cm ธงแดงและธงหมากรุกอย่างน้อย 80 × 100 cm 2.5.3 ไฟสัญญาณ มองเห็นชัดจาก 250 m กลางแดดจ้า กะพริบ 3–4 Hz มุมมองอย่างน้อย 70° (ห้ามใช้ไฟ 360°) อยู่ภายใน 30° จากแนวสายตาหลักของนักขับ 2.5.4.1 เส้นธงแดง เส้นสีกันลื่นต่อเนื่องกว้าง 20 cm คร่อมทาง 2.5.6 a โครงไฟออกตัว อยู่หลังเส้นออกตัว 10–25 m แถวล่างสูงจากผิวทางอย่างน้อย 4 m ไฟแดงอยู่เหนือไฟเขียวโดยตรง ข้อ 2.6–2.8 และ Supplement 3–6 (อ่านจากไฟล์ Appendix H 2026 เมื่อ 23 ต.ค. 2026): ส่วนที่กระทบผังและงานก่อสร้างมีดังนี้ 2.7.2.3 ป้ายจุดถังดับเพลิงข้างทาง: ตั้งฉากกับแน ้นคอนกรีตรอบสมอ"},{"c":21,"s":"c21-s4","t":"21.4 อาคาร (Fiche Gymnastique 2019)","x":"รายการ ค่า ขนาดพื้นที่ 60 × 34 m และ 44 × 24 m (ผังสนามแข่งยิมนาสติกศิลป์ใน Apparatus Norms 2026 บทที่ 4 มีขนาด 60.00 × 34.00 m ตรงกับขนาดแรก ส่วน 44 × 24 m ยังไม่ทราบว่าใช้กับระดับใด) ขนาดอื่นต้องได้รับอนุมัติจากฝ่ายเทคนิคของสหพันธ์ ความสูงโล่ง 7 m สำหรับทุกอุปกรณ์ ยิมนาสติกลีลาและแทรมโพลีน 9 m (ตารางมีอีกคอลัมน์ระบุ 5.75 m สำหรับทุกอุปกรณ์ จึงต้องยืนยันการจับคู่คอลัมน์กับระดับการใช้งาน ค่าทางการจาก Apparatus Norms 2026 อยู่ในหัวข้อ 21.6) พื้น พื้นกีฬาแล้ววางเบาะ อาคารเฉพาะยิมนาสติกใช้พื้นคอนกรีตขัดเรียบได้ บ่อรับตก (pit) ลึก 1.20–1.50 m ตามระบบรองรับและเพศของนักกีฬา ขอบบ่อต้องป้องกันการบาดเจ็บ ทำแบบบ่อจมหรือยกสูงก็ได้ แสงสว่าง ทั่วไปอย่างน้อย 800 lux รายการ FIG 1,500 lux (แทรมโพลีนและ tumbling 1,800 lux) ความสม่ำเสมอ 0.7 ตาม NBN EN 12193 (สอดคล้องกับ FIG Technical Regulations 2026 ข้อ 4.10.2: แข่งขันอย่างน้อย 1,500 lux ห้องฝึกและอบอุ่นร่างกายอย่างน้อย 800 lux) ความสูงโล่ง 7 m ต้องเผื่อจุดแขวนห่วง 5.90 m และโครงห่วงด้านบน รวมถึงโคมไฟและท่อ บ่อรับตกลึก 1.20–1.50 m เป็นงานโครงสร้างใต้ดิน ต้องออกแบบผนังกันดินและการกันน้ำใต้ดินตามบทที่ 2"},{"c":21,"s":"c21-s5","t":"21.5 ข้อกำหนดสถานที่แข่งขันใน FIG Technical Regulations 2026","x":"FIG Technical Regulations 2026 (ฉบับ Version 4.0 พ.ค. 2026) ข้อ 4.10.2 กำหนดให้อุปกรณ์และเบาะทุกชิ้นเป็นไปตาม Apparatus Norms (ข้อ 4.10.3) และมีข้อกำหนดสถานที่แยกตามประเภทดังนี้ ประเภท ข้อกำหนด ทุกประเภท แสงสว่างแข่งขันอย่างน้อย 1,500 lux ห้องฝึกและอบอุ่นร่างกายอย่างน้อย 800 lux ต้องมีการแยกพื้นที่แข่งขันกับที่นั่งผู้ชมที่มีผลและมองเห็นได้ และมีห้องอบอุ่นร่างกายติดกับห้องแข่งขัน ยิมนาสติกศิลป์ ต้องติดตั้ง podium ตาม Apparatus Norms และต้องมีระยะปลอดภัยที่เพียงพอระหว่างอุปกรณ์กับขอบ podium (ไม่บังคับใน World Cup และ World Challenge Cup) เอกสารไม่ระบุตัวเลข ยิมนาสติกลีลา ความสูงโล่งเหนือพื้นที่แสดงในห้องแข่งและห้องอบอุ่นร่างกายอย่างน้อย 10 m ระยะว่างแนวราบรอบพื้นที่แสดงในห้องแข่งอย่างน้อย 2 m (ห้องอบอุ่นร่างกายเขียนว่า \"0.50 cm\" ซึ่งน่าจะหมายถึง 0.50 m ต้องส ภายนอกตามบทนี้ ไม่รับรองโครงสร้าง 3.6.067 รูปลู่ ขอบในประกอบด้วยโค้งสองโค้งต่อด้วยทางตรงขนานสองช่วง ทางเข้าและออกโค้งต้องเปลี่ยนอย่างค่อยเป็นค่อยไป มุมเอียงกำหนดจากรัศมีโค้งและความเร็วสูงสุดของแต่ละประเภทการแข่ง 3.6.068 ความยาว 133–500 m จำนวนรอบเต็มหรือครึ่งรอบต้องได้ระยะ 1 km พอดี คลาดได้ +5 cm ชิงแชมป์โลกและโอลิมปิกต้องยาว 250 m 3.6.069 การวัด วัดที่ 20 cm เหนือขอบในของลู่ (ขอบบนของแถบสีฟ้า) 3.6.070 ความกว้าง คงที่ตลอดความยาว ลู่ Category A กว้างอย่างน้อย 7 m ลู่ Category B กว้างตามสัดส่วนความยาว อย่างน้อย 5 m (ฉบับ 2026 เปลี่ยนจาก Category 1–2) 3.6.071 แถบสีฟ้า ขี่ได้ สีฟ้า กว้างอย่างน้อย 10% ของความกว้างลู่ ผิวคุณสมบัติเดียวกับลู่ ห้ามโฆษณา ไม่นับเป็นผิวแข่ง (3.2.008) 3.6.072 เขตปลอดภัย อยู่ด้านในแถบสีฟ้า ความกว้างรวมแถบสีฟ้ากับเขตปลอดภัยอย่างน้อย 4 m สำหรับลู่ 250 m ขึ้นไป และ 2.5 m สำหรับลู่สั้นกว่า 3.6.072 bis รั้วใน สูงอย่างน้อย 120 cm เหนือระดับเขตปลอดภัย ติดตั้งถาวรที่ขอบในของเขตปลอดภัย (ยกเว้นเมื่อเขตปลอดภัยกับกลางสนามไม่มีระดับต่างหรือความลาดชันฉับพลัน ซึ่งสนามที่รับรองครั้งแรกหลัง 1 ม.ค. 2026 ต้องติดตั้งระหว่างการแข่ง) โปร่งใส มั่นคง ไม่มีส่วนยื่น ห้ามติดป้ายโฆษณา ขอบบนมีวัสดุหุ้ม รับแรงได้ 4 kN ที่จุดใดก็ได้สูงไม่เกิน 65 cm และ 1.5 kN เหนือ 65 cm ถึงขอบบน ผลคำนวณต้องรับรองโดยวิศวกรโครงสร้างและส่งในขั้นขอรับรองก่อนติดตั้งลู่ ช่องว่างทุกช่องรวมใต้รั้วต้องน้อยกว่า 1 cm จุดที่เขตปลอดภัยสูงกว่ากลางสนามตั้งแต่ 1.5 m ต้องมีตาข่ายหรือแผงเพิ่ม และสนามที่รับรองครั้งแรกหลัง 1 ม.ค. 2026 ต้องมีรั้วในสูงอย่างน้อย 2 m ที่จุดนั้น ช่วงเปลี่ยนความสูงรั้วเอียงไม่เกิน 45° 3.6.073 หน้าตัด หน้าตัดผิวลู่ทุกตำแหน่งต้องเป็นเส้นตรง ที่โค้งเอียง ขอบในควรโค้งต่อเข้าแถบสีฟ้า (3.6.073 bis) เหนือผิวลู่และเขตปลอดภัยต้องมีที่ว่างตั้งฉากกับผิวอย่างน้อย 3 m 3.6.074 ผิวลู่ ราบ เนื้อเดียวกัน ไม่ขัดสี ความเรียบคลาดได้ 5 mm ใน 2 m รับแรงได้อย่างน้อย 5 kN ที่จุดใดก็ได้ (ผลคำนวณรับรองโดยวิศวกรโครงสร้าง) ทำจากไม้ คอนกรีต หรือแอสฟัลต์ วัสดุอื่นต้องยื่นเอกสารให้ UCI อนุมัติ ผิวเคลือบต้องสม่ำเสมอทั้งลู่ 3.6.076–3.6.078 การตีเส้นและโฆษณา สีหรือวัสดุตีเส้นต้องไม่ลื่นและไม่เปลี่ยนการยึดเกาะของผิว เ   <section class="trio">
    <div><span class="lbl vi">/05</span><h3>เริ่มจาก<br>ตรงไหนดี</h3><p>อ่านบทที่ 1–2 ก่อน เพื่อเข้าใจลำดับชั้นของข้อกำหนดและหลักวิศวกรรมที่ทุกสนามใช้ร่วมกัน แล้วค่อยเลือกกีฬา</p><a class="bk" href="#/c1">บทที่ 1 ${ARW}</a></div>
    <div><span class="lbl vi">/06</span><h3>สถานะเล่ม</h3>
      <div class="livebox" hidden><div><b data-stat="views">0</b><span>ครั้งที่เข้าชม</span></div><div><b data-stat="reads">0</b><span>ครั้งที่เปิดอ่าน</span></div></div>
      <div class="bars">
        <span>SPORTS</span><span class="bar"><i style="width:${sports.length / mx * 100}%"></i></span><span>${sports.length}</span>
        <span>3D_MODELS</span><span class="bar"><i style="width:${T.widgets / mx * 100}%"></i></span><span>${T.widgets}</span>
        <span>TABLES</span><span class="bar"><i style="width:${T.tables / mx * 100}%"></i></span><span>${T.tables}</span>
        <span>SECTIONS</span><span class="bar"><i style="width:100%"></i></span><span>${T.secs}</span>
      </div>
      <div class="okbar"><span>Updated ${esc(D.built)}</span><i></i></div></div>
    <div><span class="lbl vi">/07</span><h3>ค้นหาในเล่ม</h3><p>ค้นได้ทั้งชื่อหัวข้อ ตัวเลข และคำในตาราง ทุกบท ทุกกีฬา</p>
      <form class="sform" id="hsf"><input id="hq" placeholder="ENTER KEYWORD"><button class="bk vio" type="submit">SEARCH ${ARW}</button></form>
      <div class="hatch"></div></div>
  </section>
  <section class="sec"><div class="sec-h"><span class="n">/08</span><h2>อ้างอิงจากสหพันธ์และองค์กรมาตรฐาน</h2></div>
    <div class="marq"><div class="mtrack">${[0, 1].map(k => FEDS.map(f => `<a class="mi" href="https://${f.d}" target="_blank" rel="noopener"${k ? ' aria-hidden="true" tabindex="-1"' : ''}><span class="lg"><img src="https://www.google.com/s2/favicons?domain=${f.d}&sz=128" alt="${esc(f.n)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('fail')"><b>${esc(f.n.slice(0, 4))}</b></span><span class="nm"><strong>${esc(f.n)}</strong><span>${esc(f.s)}</span></span></a>`).join('')).join('')}</div></div>
    <div class="mhint">LOGO โหลดจากเว็บไซต์ของแต่ละองค์กรเมื่อออนไลน์ · ชี้เมาส์เพื่อหยุด · คลิกเพื่อเปิดเว็บไซต์</div>
  </section>
  ${footer()}`;
  $('#hsf').onsubmit = e => { e.preventDefault(); openSearch($('#hq').value); };
  let miniCtl = null, miniCard = null;
  const canHover = matchMedia('(hover: hover)').matches;
  const on = card => { if (miniCard === card) return; off(); miniCard = card; card.classList.add('live'); miniCtl = VOX.mini(card.querySelector('.mini'), +card.dataset.num); };
  const off = () => { if (miniCtl) miniCtl.stop(); if (miniCard) miniCard.classList.remove('live'); miniCtl = null; miniCard = null; };
  if (canHover) document.querySelectorAll('.sp[data-num]').forEach(card => {
    card.addEventListener('mouseenter', () => on(card)); card.addEventListener('mouseleave', off);
    card.addEventListener('focus', () => on(card)); card.addEventListener('blur', off);
  });
  let built = 0; const seen = new Set();
  VOX.start($('#voxc'), {
    onField(f){ const c = D.chapters.find(x => x.num === String(f.num)); seen.add(f.num);
      const href = c ? '#/' + c.id : '#/';
      $('#vxk').innerHTML = f.k.join('<br>'); $('#vxk').href = href; $('#vxn').href = href;
      $('#vxn').innerHTML = `<span class="e">${f.e}</span><span><b>${f.code}</b><small>${c ? esc(c.short) + ' ↗' : ''}</small></span>`;
      $('#vxs').textContent = '//FIELD_' + pad(f.num);
      $('#vxr').innerHTML = `&gt; ASSEMBLING ${f.code}<br>&gt; ${pad(seen.size)}/${VOX.fields.length} FIELDS`; },
    onPhase(ph){ const f = VOX.current(); if (!f) return;
      $('#vxr').innerHTML = ph === 'scatter' ? `&gt; SCATTERING…<br>&gt; NEXT: RANDOM` : `&gt; BUILT ${f.code}<br>&gt; ${pad(seen.size)}/${VOX.fields.length} FIELDS`;
      $('#vxn').classList.toggle('off', ph === 'scatter'); $('#vxk').classList.toggle('off', ph === 'scatter'); }
  });
  setCrumb(null);
  document.title = D.title;
  STAT.paint();
  if (jump) { const t = document.getElementById(jump); if (t) t.scrollIntoView(); } else scrollTo(0, 0);
}

function footer(){
  const ln = c => `<a href="#/${c.id}">${meta(c).e} ${esc(c.short.replace(/^สนาม/, ''))}</a>`;
  return `<section class="foot">
    <div><button class="logo" style="padding:0;border:0" onclick="location.hash='#/'"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 2h7v7H2zM11 11h7v7h-7z" fill="currentColor"/><path d="M11 2h7v7h-7zM2 11h7v7H2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>FIELD_STD<i></i></button>
      <div class="small">คู่มือมาตรฐานสนามกีฬาและการออกแบบก่อสร้าง<br>ตามหลักวิศวกรรมโยธา<br>${esc(D.byline)}</div></div>
    <div class="fsports"><h4>กีฬา · ${sports.length} MODULES</h4><div class="cols">${sports.map(ln).join('')}</div></div>
    <div><h4>วิศวกรรม_ภาคผนวก</h4>${others.map(c => `<a href="#/${c.id}">${meta(c).e} ${esc(c.short)}</a>`).join('')}</div>
  </section>
  <section class="status"><span><i class="dot"></i>Offline ready</span><a href="#/sports" data-jump="sports">&gt; เลือกกีฬา_</a><span class="rt"><span>CH: ${pad(D.chapters.filter(c => c.num).length)}</span><span class="vstat" hidden>VISITS: <b data-stat="views">0</b></span><span>NODE: FIELD_01</span></span></section>`;
}

let io;
function renderChapter(cid, sid){
  const i = D.chapters.findIndex(c => c.id === cid);
  if (i < 0) return renderHome();
  const c = D.chapters[i], m = meta(c);
  const pv = D.chapters[i - 1], nx = D.chapters[i + 1];
  window.EBW && EBW.unmountAll(); VOX.stop();
  main.innerHTML = `
  <section class="ch-top">
    <div class="emobox"><span class="e">${m.e}</span><span class="tagc">${m.code}</span></div>
    <div class="ch-info">
      <span class="lbl vi">/${c.num ? pad(c.num) : '--'} · ${isSport(c) ? 'SPORT_MODULE' : 'DOC_MODULE'}</span>
      <h1 class="big">${esc(c.short)}</h1>
      <div class="ch-meta">${c.num ? `<span class="chip v">${esc(lab(c))}</span>` : ''}${c.secs.length ? `<span class="chip">${c.secs.length} sections</span>` : ''}${c.tables ? `<span class="chip">${c.tables} tables</span>` : ''}${c.widgets ? `<span class="chip">3D × ${c.widgets}</span>` : ''}<span class="chip" id="rt"></span><span class="chip v rchip" hidden>อ่านแล้ว <b data-rc-n="${c.id}">0</b> ครั้ง</span></div>
      <div class="ch-actions"><a class="bk" href="#/sports" data-jump="sports">← เลือกกีฬาอื่น</a></div>
    </div>
  </section>
  ${c.secs.length ? `<nav class="idx"><div class="lbl">/INDEX — กระโดดไปหัวข้อ</div><div class="idx-list">${c.secs.map(s => { const mm = s.title.match(/^(\d+(?:\.\d+)*)\s+(.*)$/); return `<a href="#/${c.id}/${s.id}">${mm ? `<b>${mm[1]}</b>${esc(mm[2])}` : esc(s.title)}</a>`; }).join('')}</div></nav>` : ''}
  <section class="body"><div class="gut"><span class="y">${m.code} // ${c.num ? 'CH_' + pad(c.num) : 'DOC'}</span></div><article id="art"></article><div class="gut r"></div></section>
  <nav class="pager">
    ${pv ? `<a href="#/${pv.id}"><small>← /${pv.num ? pad(pv.num) : '--'} prev</small><span>${meta(pv).e} ${esc(pv.short)}</span></a>` : '<span></span>'}
    <a class="mid" href="#/sports" data-jump="sports"><small>/INDEX</small><span>เลือกกีฬา</span></a>
    ${nx ? `<a class="nx" href="#/${nx.id}"><small>/${nx.num ? pad(nx.num) : '--'} next →</small><span>${meta(nx).e} ${esc(nx.short)}</span></a>` : '<span></span>'}
  </nav>
  ${footer()}`;
  const art = $('#art');
  art.appendChild(document.getElementById('t-' + cid).content.cloneNode(true));
  art.querySelectorAll('h3').forEach(h => { const mm = h.textContent.match(/^(\d+(?:\.\d+)*)\s+([\s\S]*)$/); if (mm) h.innerHTML = `<span class="sn">/${mm[1]}</span>${esc(mm[2])}`; });
  art.querySelectorAll('.widget-card').forEach((f, k) => {
    const h = document.createElement('div'); h.className = 'wc-h';
    h.innerHTML = `<span>/3D_${pad(k + 1)}</span><span>${m.code}</span>`;
    f.prepend(h);
    f.insertAdjacentHTML('beforeend', '<span class="plus tl"></span><span class="plus br"></span>');
  });
  $('#rt').textContent = '~' + Math.max(1, Math.round(art.textContent.length / 900)) + ' min read';
  setCrumb(c);
  document.title = m.e + ' ' + (c.num ? 'บทที่ ' + c.num + ' ' : '') + c.short;
  store.set('cy.last', cid);
  STAT.read(cid);
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { EBW.mount(e.target); io.unobserve(e.target); } }), {rootMargin: '600px 0px'});
  art.querySelectorAll('.widget').forEach(w => io.observe(w));
  if (sid) { const t = document.getElementById(sid); if (t) { t.scrollIntoView(); flash(t); return; } }
  scrollTo(0, 0);
}
function setCrumb(c){
  const cr = $('#crumb'), ln = $('#links');
  if (!c) { cr.style.display = 'none'; ln.style.display = ''; return; }
  ln.style.display = 'none'; cr.style.display = 'flex';
  cr.innerHTML = `<a href="#/">HOME</a>&nbsp;/&nbsp;<a href="#/sports" data-jump="sports">${isSport(c) ? 'SPORTS' : 'DOCS'}</a>&nbsp;/&nbsp;<b>${meta(c).e} ${esc(c.short)}</b>`;
}
function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

let current = null;
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [cid, sid] = h.split('/');
  if (!cid || cid === 'sports') { current = null; return renderHome(cid === 'sports' ? 'sports' : null); }
  if (cid === current && sid) { const t = document.getElementById(sid); if (t) { t.scrollIntoView(); flash(t); } return; }
  current = cid; renderChapter(cid, sid);
}
addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-jump]');
  if (a && (location.hash === '#/sports')) { e.preventDefault(); if (current) { current = null; renderHome('sports'); } else document.getElementById('sports').scrollIntoView(); }
});

addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  progress.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  $('#fab').classList.toggle('show', scrollY > 900);
}, {passive: true});
$('#fab').onclick = () => scrollTo({top: 0, behavior: 'smooth'});
$('#homeBtn').onclick = () => { location.hash = '#/'; };
let zz = parseFloat(store.get('cy.z')) || 1;
const setZ = v => { zz = Math.round(Math.max(0.8, Math.min(1.5, v)) * 10) / 10; document.documentElement.style.setProperty('--z', zz); store.set('cy.z', zz); $('#zval').textContent = Math.round(zz * 100) + '%'; };
setZ(zz);
$('#fsDown').onclick = () => setZ(zz - 0.1);
$('#fsUp').onclick = () => setZ(zz + 0.1);
$('#zval').onclick = () => setZ(1);
$('#themeBtn').onclick = () => { const nx = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store.set('cy.theme', nx); };

// search
const ov = $('#overlay'), q = $('#q'), sres = $('#sres');
let sel = 0;
function openSearch(v){ ov.classList.add('open'); q.value = typeof v === 'string' ? v : ''; doSearch(); q.focus(); }
function closeSearch(){ ov.classList.remove('open'); }
$('#searchBtn').onclick = () => openSearch();
ov.addEventListener('click', e => { if (e.target === ov) closeSearch(); });
function doSearch(){
  const v = q.value.trim().toLowerCase();
  if (!v) { sres.innerHTML = '<div class="sempty">&gt; AWAITING_INPUT_</div>'; return; }
  const terms = v.split(/\s+/).filter(Boolean);
  let hits = [];
  for (const r of IDX) {
    const T = r.t.toLowerCase(), X = r.x.toLowerCase();
    if (!terms.every(t => T.includes(t) || X.includes(t))) continue;
    hits.push({r, s: terms.reduce((a, t) => a + (T.includes(t) ? 5 : 0) + (X.split(t).length - 1), 0)});
  }
  hits.sort((a, b) => b.s - a.s); hits = hits.slice(0, 40); sel = 0;
  if (!hits.length) { sres.innerHTML = '<div class="sempty">&gt; NO_MATCH — ไม่พบคำนี้ในเล่ม</div>'; return; }
  const hl = s => { let o = esc(s); terms.forEach(t => { o = o.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); }); return o; };
  sres.innerHTML = hits.map(({r}, i) => {
    const c = D.chapters[r.c]; const p = Math.max(0, r.x.toLowerCase().indexOf(terms[0]) - 60);
    return `<a href="#/${c.id}${r.s !== c.id ? '/' + r.s : ''}" class="${i ? '' : 'sel'}"><div class="w">${meta(c).e} /${c.num ? pad(c.num) : '--'} ${esc(c.short)}</div><div class="h">${hl(r.t)}</div><div class="x">${hl((p ? '…' : '') + r.x.slice(p, p + 200))}</div></a>`;
  }).join('');
  sres.querySelectorAll('a').forEach(a => a.addEventListener('click', closeSearch));
}
q.addEventListener('input', doSearch);
q.addEventListener('keydown', e => {
  const as = sres.querySelectorAll('a');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!as.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle('sel', i === sel)); as[sel].scrollIntoView({block: 'nearest'}); }
  if (e.key === 'Enter' && as[sel]) { location.hash = as[sel].getAttribute('href'); closeSearch(); }
});
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') { closeSearch(); return; }
  if (ov.classList.contains('open') || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); }
  const i = D.chapters.findIndex(c => c.id === current);
  if (e.key === 'ArrowRight') { const n = current ? D.chapters[i + 1] : D.chapters[0]; if (n) location.hash = '#/' + n.id; }
  if (e.key === 'ArrowLeft' && current) { const p = D.chapters[i - 1]; location.hash = p ? '#/' + p.id : '#/'; }
});
route();
STAT.view();
})();
</script>
</body>
</html>
