<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="นายกฤช เดชมี และ นายกิม ลีลาพงศ์">
<meta name="description" content="คู่มือมาตรฐานสนามกีฬาและการออกแบบก่อสร้างตามหลักวิศวกรรมโยธา 20 ชนิดกีฬา พร้อมภาพสามมิติ จัดทำโดย นายกฤช เดชมี และ นายกิม ลีลาพงศ์">
<title>คู่มือมาตรฐานสนามกีฬาและการออกแบบก่อสร้างตามหลักวิศวกรรมโยธา (ฉบับตรวจแหล่งอ้างอิง)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@600;800&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2; --paper:#ffffff; --ink:#0b0b0c; --ink-2:#3c3c40; --muted:#6c6c72; --faint:#a3a3a8;
  --line:#d9d9dc; --line-2:#0b0b0c; --violet:#7b3fe4; --violet-soft:#efe7fd; --lime:#d8f56a; --lime-ink:#0b0b0c;
  --cds-text-primary:var(--ink); --cds-text-secondary:var(--muted); --cds-chart-axis:var(--line);
  --cds-chart-categorical-1:var(--violet); --cds-chart-reference-tint:var(--paper);
  --z:1; --fs:calc(16.5px * var(--z));
  --head:"Anton","Kanit",Impact,"Arial Narrow",sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Consolas,"Kanit",monospace;
  --body:"IBM Plex Sans Thai","Sarabun","Leelawadee UI",Thonburi,Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0c0c0e; --paper:#141417; --ink:#f1f1f3; --ink-2:#c9c9ce; --muted:#9a9aa2; --faint:#5d5d65;
  --line:#2a2a30; --line-2:#f1f1f3; --violet:#a67bff; --violet-soft:#221935; --lime:#d8f56a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.frame{max-width:1240px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--paper);position:relative}
.lbl{font-family:var(--mono);font-size:calc(12px * var(--z));letter-spacing:.06em;text-transform:uppercase}
.vi{color:var(--violet)}
.plus{position:absolute;width:11px;height:11px;pointer-events:none}
.plus::before,.plus::after{content:"";position:absolute;background:var(--ink)}
.plus::before{left:5px;top:0;width:1px;height:11px}.plus::after{top:5px;left:0;height:1px;width:11px}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line-2)}
.nav-in{max-width:1240px;margin:0 auto;display:flex;align-items:stretch;height:64px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;padding:0 22px;font-family:var(--mono);font-weight:700;font-size:calc(16px * var(--z));letter-spacing:.02em;cursor:pointer;background:none;border:0;border-right:1px solid var(--line);white-space:nowrap}
.logo i{display:inline-block;width:8px;height:16px;background:var(--violet);animation:blink 1.1s steps(1) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}
.links{display:flex;align-items:center;gap:6px;padding:0 18px;flex:1;min-width:0;overflow:hidden}
.links a{font-family:var(--mono);font-size:calc(12.5px * var(--z));text-decoration:none;text-transform:uppercase;padding:6px 6px;white-space:nowrap}
.links a:hover{color:var(--violet)}
.links .sep{color:var(--faint);font-family:var(--mono);font-size:calc(12px * var(--z))}
.crumb{font-family:var(--mono);font-size:calc(12.5px * var(--z));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:700}
.clock{display:flex;flex-direction:column;justify-content:center;padding:0 16px;border-left:1px solid var(--line);font-family:var(--mono);font-size:calc(10.5px * var(--z));line-height:1.5;color:var(--muted);white-space:nowrap}
.clock b{color:var(--ink);font-weight:500;font-size:calc(12px * var(--z))}
.tools{display:flex;align-items:center;gap:4px;padding:0 10px;border-left:1px solid var(--line)}
.ic{height:36px;min-width:36px;border:1px solid transparent;background:none;cursor:pointer;font-family:var(--mono);font-size:calc(12px * var(--z));display:inline-flex;align-items:center;justify-content:center}
.ic:hover{border-color:var(--ink)}
.cta-nav{display:flex;align-items:center;padding:0 14px 0 6px}
.bk{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 16px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-family:var(--mono);font-size:calc(12.5px * var(--z));font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.bk svg{width:15px;height:15px}
.bk:hover{background:var(--violet);border-color:var(--violet)}
.bk.ghost{background:transparent;color:var(--ink);border-color:transparent}
.bk.ghost:hover{border-color:var(--ink);background:transparent}
.bk.vio{background:var(--violet);border-color:var(--violet);color:#fff}
.bk.vio:hover{background:var(--ink);border-color:var(--ink)}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--violet);width:0}

/* sections */
.sec{border-bottom:1px solid var(--line);padding:34px 56px;position:relative}
.sec-h{display:flex;gap:18px;align-items:baseline;margin-bottom:22px}
.sec-h .n{font-family:var(--mono);font-size:calc(12.5px * var(--z));color:var(--violet)}
.sec-h h2{font-family:var(--mono);font-size:calc(13px * var(--z));font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
.sec-h .r{margin-left:auto;font-family:var(--mono);font-size:calc(11.5px * var(--z));color:var(--faint)}

/* hero */
.hero{display:grid;grid-template-columns:64px 1.1fr 1fr;border-bottom:1px solid var(--line);min-height:560px}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 0}
.rail .v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:calc(11px * var(--z));color:var(--violet);letter-spacing:.1em;text-transform:uppercase}
.rail .y{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:calc(13px * var(--z));font-weight:700}
.rail .ticks{display:flex;flex-direction:column;gap:22px}
.rail .ticks span{width:1px;height:10px;background:var(--faint)}
.hero-l{padding:40px 40px 40px 34px;display:flex;flex-direction:column}
.big{font-family:var(--head);font-weight:800;font-size:calc(clamp(52px,7.4vw,104px) * var(--z));line-height:.98;letter-spacing:-.01em;margin:16px 0 18px;text-transform:uppercase}
.big .th{font-family:"Kanit",var(--head);font-weight:800;font-size:.6em;line-height:1.4;display:block;letter-spacing:0;text-transform:none;margin-top:.28em}
.tag{font-family:var(--mono);font-size:calc(15px * var(--z));color:var(--violet);letter-spacing:.04em;text-transform:uppercase;margin:0 0 16px}
.lede{font-family:var(--mono);font-size:calc(13px * var(--z));line-height:1.75;color:var(--ink-2);max-width:470px}
.lede-th{font-size:calc(14.5px * var(--z));color:var(--ink-2);max-width:480px;margin-top:10px}
.hero-cta{display:flex;gap:14px;align-items:center;margin-top:auto;padding-top:28px;flex-wrap:wrap}
.hero-r{border-left:1px solid var(--line);position:relative;overflow:hidden;background:
  repeating-linear-gradient(0deg,transparent 0 39px,color-mix(in srgb,var(--line) 70%,transparent) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,color-mix(in srgb,var(--line) 70%,transparent) 39px 40px)}
.hero-r canvas.vox{position:absolute;inset:0;width:100%;height:100%;display:block}
.coords{text-decoration:none;transition:opacity .4s}.coords:hover{outline:2px solid var(--ink)}
.vxname{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--ink);padding:6px 12px 6px 8px;text-decoration:none;box-shadow:3px 3px 0 var(--violet);transition:opacity .4s,transform .4s;max-width:60%}
.vxname .e{font-size:calc(26px * var(--z));line-height:1}
.vxname b{display:block;font-family:var(--mono);font-size:calc(12px * var(--z));letter-spacing:.04em}
.vxname small{display:block;font-size:calc(11.5px * var(--z));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vxname:hover{transform:translate(-2px,-2px)}
.vxname.off,.coords.off{opacity:.25}
.readout{position:absolute;left:18px;top:18px;font-family:var(--mono);font-size:calc(11px * var(--z));line-height:1.7;background:var(--paper);border:1px solid var(--line);padding:6px 10px}
.coords{position:absolute;right:18px;bottom:62px;background:color-mix(in srgb,var(--lime) 55%,var(--paper));border:1px solid var(--lime);font-family:var(--mono);font-size:calc(12px * var(--z));line-height:1.8;padding:10px 16px;color:#0b0b0c}
.scn{position:absolute;right:18px;bottom:18px;font-family:var(--mono);font-size:calc(12px * var(--z));font-weight:700}
.globe{position:absolute;right:18px;top:16px;width:30px;height:30px}

/* principles */
.prin{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.pr{display:flex;gap:14px;padding:6px 18px 6px 0;position:relative}
.pr + .pr{padding-left:18px}
.pr svg{width:40px;height:40px;flex:none;color:var(--ink)}
.pr h3{font-family:var(--mono);font-size:calc(12px * var(--z));font-weight:700;color:var(--violet);text-transform:uppercase;margin:0 0 6px;line-height:1.45;letter-spacing:.03em}
.pr p{font-family:var(--mono);font-size:calc(11.5px * var(--z));line-height:1.65;margin:0;color:var(--ink-2)}

/* sport grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sp{display:flex;flex-direction:column;border:1px solid var(--ink);background:var(--paper);text-decoration:none;color:var(--ink);position:relative;transition:transform .12s, box-shadow .12s;min-height:258px}
.sp:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--violet),6px 6px 0 var(--ink)}
.sp .art{height:168px;border-bottom:1px solid var(--ink);display:grid;place-items:center;position:relative;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 13px,var(--line) 13px 14px),repeating-linear-gradient(90deg,transparent 0 13px,var(--line) 13px 14px),var(--bg)}
.sp .emo{font-size:calc(56px * var(--z));line-height:1;filter:saturate(1.05);transition:transform .2s}

.sp .no{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:calc(11px * var(--z));font-weight:700;background:var(--paper);border:1px solid var(--ink);padding:0 6px}
.sp .px{position:absolute;right:8px;top:8px;display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.sp .px i{width:6px;height:6px;background:var(--violet)}.sp .px i:nth-child(2n){background:var(--lime)}.sp .px i:nth-child(3n){background:transparent}
.sp .bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.sp .t{font-family:"Kanit",var(--body);font-weight:600;font-size:calc(16px * var(--z));line-height:1.35}
.sp .m{font-family:var(--mono);font-size:calc(10.5px * var(--z));color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto}
.sp .m svg{width:16px;height:16px;color:var(--violet)}
.side-plus{position:absolute;top:58px;bottom:30px;width:11px;display:flex;flex-direction:column;justify-content:space-between}
.side-plus.l{left:22px}.side-plus.r{right:22px}
.side-plus span{position:relative;width:11px;height:11px}
.side-plus span::before,.side-plus span::after{content:"";position:absolute;background:var(--faint)}
.side-plus span::before{left:5px;width:1px;height:11px}.side-plus span::after{top:5px;height:1px;width:11px}

.eng{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.eg{display:flex;gap:12px;align-items:center;padding:14px 16px;text-decoration:none;border-right:1px solid var(--ink)!important;border-bottom:1px solid var(--ink)!important;background:var(--paper)}
.eg:hover{background:var(--violet);color:#fff}
.eg .e{font-size:calc(26px * var(--z));flex:none}
.eg .no{font-family:var(--mono);font-size:calc(10.5px * var(--z));color:var(--violet)}
.eg:hover .no{color:var(--lime)}
.eg .t{font-size:calc(14px * var(--z));line-height:1.4;font-weight:500}

/* trio */
.trio{display:grid;grid-template-columns:1fr 1.15fr 1.25fr;border-bottom:1px solid var(--line)}
.trio > div{padding:30px 34px;border-right:1px solid var(--line);position:relative}
.trio > div:last-child{border-right:0}
.trio h3{font-family:var(--mono);font-size:calc(19px * var(--z));font-weight:700;text-transform:uppercase;line-height:1.3;margin:8px 0 12px}
.trio p{font-family:var(--mono);font-size:calc(12px * var(--z));line-height:1.7;color:var(--ink-2);margin:0 0 18px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;font-family:var(--mono);font-size:calc(11px * var(--z));margin-bottom:16px}
.bar{height:3px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--violet)}
.okbar{display:flex;justify-content:space-between;align-items:center;background:var(--lime);color:var(--lime-ink);font-family:var(--mono);font-size:calc(11px * var(--z));font-weight:700;padding:7px 12px;text-transform:uppercase}
.okbar i{width:8px;height:8px;border-radius:50%;background:#0b0b0c}
.sform{display:flex;margin-top:4px}
.sform input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-right:0;background:var(--paper);padding:0 12px;font-family:var(--mono);font-size:calc(12px * var(--z));color:var(--ink);outline:none}
.sform input:focus{border-color:var(--violet)}
.hatch{height:12px;margin-top:20px;background:repeating-linear-gradient(-55deg,var(--faint) 0 1px,transparent 1px 7px);opacity:.7}

.fed{display:flex;flex-wrap:wrap;gap:10px 30px;align-items:center}
.fed span{font-family:var(--mono);font-weight:700;font-size:calc(15px * var(--z));letter-spacing:.02em;color:var(--ink-2)}
.fed span::before{content:"▲ ";color:var(--violet);font-size:calc(10px * var(--z));vertical-align:2px}

/* footer */
.foot{display:grid;grid-template-columns:1.2fr 2fr 1.2fr;gap:24px;padding:30px 56px 26px;border-bottom:1px solid var(--line)}
.foot h4{font-family:var(--mono);font-size:calc(11px * var(--z));font-weight:700;letter-spacing:.06em;margin:0 0 10px;text-transform:uppercase}
.foot a{display:block;font-size:calc(12.5px * var(--z));color:var(--ink-2);text-decoration:none;line-height:1.9}
.foot a:hover{color:var(--violet)}
.foot .small{font-family:var(--mono);font-size:calc(11px * var(--z));color:var(--muted);line-height:1.7;margin-top:18px}
.status{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:stretch;font-family:var(--mono);font-size:calc(11.5px * var(--z));text-transform:uppercase}
.status > *{display:flex;align-items:center;padding:12px 24px;gap:10px}
.status .dot{width:7px;height:7px;background:var(--lime);border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--lime) 35%,transparent)}
.status a{background:var(--violet);color:#fff;justify-content:center;text-decoration:none;letter-spacing:.06em}
.status a:hover{background:var(--ink)}
.status .rt{justify-content:flex-end;gap:22px;color:var(--ink-2)}

/* chapter */
.ch-top{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--line)}
.emobox{border-right:1px solid var(--line);display:grid;place-items:center;position:relative;min-height:220px;
  background:repeating-linear-gradient(0deg,transparent 0 19px,var(--line) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--line) 19px 20px),var(--bg)}
.emobox .e{font-size:calc(110px * var(--z));line-height:1;filter:drop-shadow(6px 6px 0 color-mix(in srgb,var(--violet) 45%,transparent))}
.emobox .tagc{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:calc(10.5px * var(--z));background:var(--lime);color:#0b0b0c;padding:1px 6px;font-weight:700}
.ch-info{padding:28px 40px 26px;display:flex;flex-direction:column;gap:8px}
.ch-info .big{font-size:calc(clamp(36px,5vw,64px) * var(--z));margin:4px 0 6px;text-transform:none;font-family:"Kanit",var(--head)}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:calc(11px * var(--z));text-transform:uppercase;border:1px solid var(--ink);padding:3px 8px}
.chip.v{background:var(--violet);border-color:var(--violet);color:#fff}
.ch-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.idx{padding:18px 40px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.idx .lbl{color:var(--muted);margin-bottom:10px}
.idx-list{display:flex;flex-wrap:wrap;gap:8px}
.idx-list a{font-size:calc(13px * var(--z));text-decoration:none;border:1px solid var(--ink);background:var(--paper);padding:5px 10px;line-height:1.4}
.idx-list a b{font-family:var(--mono);color:var(--violet);font-weight:700;margin-right:6px}
.idx-list a:hover{background:var(--ink);color:var(--paper)}
.idx-list a:hover b{color:var(--lime)}
.body{display:grid;grid-template-columns:64px minmax(0,1fr) 64px}
.body > *{min-width:0}
.body .gut{border-right:1px solid var(--line);position:relative}
.body .gut.r{border-right:0;border-left:1px solid var(--line)}
.body .gut .y{position:sticky;top:100px;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:calc(11px * var(--z));color:var(--violet);letter-spacing:.1em;text-transform:uppercase;margin:24px auto;display:block}
article{padding:30px 48px 40px;max-width:900px;width:100%;margin:0 auto}
article h3{font-family:"Kanit",var(--body);font-weight:600;font-size:1.45em;line-height:1.35;margin:2.6em 0 .8em;padding:14px 0 0;border-top:2px solid var(--ink);position:relative}
article h3 .sn{display:block;font-family:var(--mono);font-size:calc(12px * var(--z));color:var(--violet);font-weight:700;letter-spacing:.06em;margin-bottom:4px}
article h4{font-family:var(--mono);font-size:.95em;text-transform:uppercase;letter-spacing:.02em;margin:2em 0 .5em;padding-left:10px;border-left:4px solid var(--lime)}
article p{margin:.7em 0}
article ul,article ol{padding-left:1.3em;margin:.6em 0}
article li{margin:.28em 0}
article ul li::marker{content:"▪  ";color:var(--violet)}
article strong{font-weight:600}
article a{color:var(--violet);text-underline-offset:3px}
article code{font-family:var(--mono);font-size:.85em;background:var(--violet-soft);padding:.05em .35em}
article pre{background:var(--ink);color:var(--paper);padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:calc(13px * var(--z))}
article blockquote{margin:1.2em 0;padding:.6em 1.1em;border-left:4px solid var(--violet);background:var(--violet-soft)}
article hr{border:0;border-top:1px dashed var(--faint);margin:2.4em 0}
article input[type=checkbox]{accent-color:var(--violet)}
.math{overflow-x:auto;margin:1.2em 0;padding:16px 18px;border:1px solid var(--ink);background:var(--paper);position:relative}
.math::before{content:"/EQ";position:absolute;left:8px;top:4px;font-family:var(--mono);font-size:calc(10px * var(--z));color:var(--violet)}
math{font-size:1.1em}
.table-wrap{overflow-x:auto;margin:1.3em 0;border:1px solid var(--ink);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.86em;line-height:1.6}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
th:last-child,td:last-child{border-right:0}

<template id="t-c0"><p>สนามกีฬาหนึ่งสนามเกิดจากความรู้สองชุดที่ต้องเดินไปด้วยกัน ชุดแรกคือ <strong>กติกาของสหพันธ์กีฬา</strong> ซึ่งบอกว่าสนามต้องกว้างเท่าไร ยาวเท่าไร เส้นอยู่ตรงไหน และอุปกรณ์สูงเท่าไร ชุดที่สองคือ <strong>หลักวิศวกรรมโยธา</strong> ซึ่งบอกว่าจะสร้างให้ได้ขนาดนั้นจริงอย่างไร ดินต้องบดอัดแค่ไหน น้ำฝนจะระบายไปทางใด และพื้นต้องรับการใช้งานได้ปลอดภัยเพียงใด</p>
<p>ปัญหาที่พบบ่อยคือข้อมูลสองชุดนี้กระจายอยู่คนละที่ กติกาเขียนเป็นภาษาอังกฤษในเอกสารของแต่ละสหพันธ์ บางค่าซ่อนอยู่ในแผนภาพแทนที่จะเป็นข้อความ บางฉบับเปลี่ยนทุกปี ส่วนข้อกำหนดงานโยธากระจายอยู่ในคู่มือเทคนิค มาตรฐานวิศวกรรม และกฎหมายอาคาร หนังสือเล่มนี้พยายามรวบทั้งหมดไว้ในที่เดียว และเขียนให้ผู้อ่านตรวจย้อนกลับไปหาต้นฉบับได้ทุกครั้ง</p>
<h3 id="c0-s1">หนังสือเล่มนี้มีอะไร</h3>
<ul>
<li><strong>บทที่ 1–2 พื้นฐาน:</strong> ลำดับชั้นของข้อกำหนด การแยกพื้นที่เล่นออกจากพื้นที่ก่อสร้าง หน่วยและการแปลง และหลักวิศวกรรมโยธาที่ทุกสนามใช้ร่วมกัน ตั้งแต่งานดิน การบดอัด การระบายน้ำ ไปจนถึงการตรวจมุมฉากของผัง</li>
<li><strong>บทที่ 3–22 สนามกีฬา 20 ประเภท:</strong> แต่ละบทมีมิติตามกติกา เส้นและอุปกรณ์ พิกัดสำหรับวางผังใน CAD พื้นที่รอบสนาม และข้อกำหนดพื้นผิวหรือโครงสร้างเท่าที่สหพันธ์กำหนดไว้</li>
<li><strong>บทที่ 23–24 ภาคปฏิบัติ:</strong> ตารางเปรียบเทียบสนาม และตัวอย่างคำนวณปริมาณงาน (BOQ)</li>
<li><strong>ท้ายเล่ม:</strong> แหล่งอ้างอิงทั้งหมด ข้อจำกัดของการตรวจ และรายการข้อมูลที่ยังยืนยันจากต้นฉบับไม่ได้ พร้อมเหตุผล</li>
<li><strong>ภาพสามมิติ:</strong> สนามส่วนใหญ่มีภาพสามมิติที่ลากหมุนดูได้รอบทิศ วาดจากค่าในบทนั้นโดยตรง และมีภาพตัดชั้นโครงสร้างสนามหญ้าเทียมอีกหนึ่งภาพ</li>
</ul>
<h3 id="c0-s2">หลักที่ใช้เขียน</h3>
<ol>
<li><strong>ทุกตัวเลขสำคัญมีที่มา</strong> ค่าที่เป็นข้อกำหนดเปิดอ่านจากเอกสารของสหพันธ์หรือหน่วยงานผู้ออกมาตรฐานโดยตรง และระบุฉบับกับวันที่ตรวจไว้ ไม่มีตัวเลขใดเติมจากความจำ</li>
<li><strong>แยกให้เห็นว่าค่าไหนมาจากไหน</strong> ค่าที่ผู้เขียนคำนวณต่อจากกติกากำกับว่า (คำนวณ) และค่าที่ต้องตีความเพราะต้นฉบับเขียนไม่ชัดกำกับว่า (ตีความ) ค่าที่คำนวณทุกค่าตรวจซ้ำด้วยสคริปต์แล้ว</li>
<li><strong>แยกข้อบังคับออกจากข้อแนะนำ</strong> กติกาตัดสินว่าสนามถูกต้องหรือไม่ ส่วนคู่มือเทคนิคหลายฉบับเป็นเพียงข้อแนะนำ หนังสือจะบอกไว้ทุกครั้งว่าค่านั้นอยู่ชั้นใด</li>
<li><strong>บอกตรง ๆ เมื่อไม่รู้</strong> ถ้าสหพันธ์ไม่ได้กำหนดค่าใด หรือเปิดเอกสารต้นฉบับไม่ได้ หนังสือจะเขียนว่ายังไม่มีข้อมูล แทนการเดาค่าให้ดูครบ</li>
</ol>
<h3 id="c0-s3">ใครควรอ่าน และอ่านอย่างไร</h3>
<p>หนังสือเล่มนี้เขียนให้วิศวกรโยธา ผู้ออกแบบ นักศึกษา เจ้าของโครงการ และผู้ดูแลสนาม ใช้เป็นจุดเริ่มต้นก่อนเปิดกติกาฉบับเต็มของแต่ละกีฬา</p>
<p>ผู้อ่านที่เพิ่งเริ่มควรอ่านบทที่ 1 และ 2 ก่อน เพราะเป็นกรอบที่ทุกบทใช้ร่วมกัน จากนั้นเลือกอ่านเฉพาะกีฬาที่สนใจได้เลย แต่ละบทอ่านจบในตัว ส่วนผู้ที่กำลังทำโครงการจริง ควรใช้ตารางพิกัดคู่กับต้นฉบับของสหพันธ์ฉบับล่าสุด</p>
<h3 id="c0-s4">ข้อควรระวัง</h3>
<ul>
<li><strong>ไม่ใช่แบบก่อสร้าง</strong> หนังสือเล่มนี้ไม่ใช้แทนการออกแบบและลงนามรับรองโดยวิศวกรผู้ได้รับใบอนุญาต ข้อความที่ไม่ได้อ้างแหล่งข้อกำหนดคือหลักการวิศวกรรมทั่วไป ไม่ใช่ข้อกำหนดของมาตรฐานใด</li>
<li><strong>กติกาเปลี่ยนได้</strong> สหพันธ์หลายแห่งปรับกติกาทุกปีหรือทุกฤดูกาล ก่อนใช้ค่าใดในสัญญาหรือแบบก่อสร้าง ให้ตรวจกับฉบับที่มีผลอยู่ในวันนั้น</li>
<li><strong>ภาพสามมิติใช้เพื่อเรียนรู้</strong> ภาพช่วยให้เห็นตำแหน่งและสัดส่วน แต่ไม่ใช่แบบตามมาตราส่วนสำหรับก่อสร้าง</li>
<li><strong>ค่าที่ขึ้นกับพื้นที่</strong> เช่น ความหนาชั้นวัสดุ ความลาดเอียง และการระบายน้ำ ต้องออกแบบจากผลสำรวจดินและข้อกำหนดของโครงการเสมอ</li>
</ul>
<p>หวังว่าหนังสือเล่มนี้จะช่วยให้การวางผังและก่อสร้างสนามกีฬาในประเทศไทยแม่นยำขึ้น และช่วยลดเวลาที่ต้องตามหาตัวเลขจากเอกสารหลายสิบฉบับ หากพบค่าที่ไม่ตรงกับต้นฉบับฉบับใหม่ ให้ยึดต้นฉบับเป็นหลัก</p>
<p><strong>จัดทำโดย</strong> นายกฤช เดชมี และ นายกิม ลีลาพงศ์</p>
<p>ฉบับปรับปรุง 23 ต.ค. 2026</p>
<h3 id="c0-s5">บันทึกการตรวจและการแก้ไข</h3>
<p>ทุกตัวเลขสำคัญในเล่มตรวจย้อนถึงเอกสารต้นฉบับได้ ไม่มีตัวเลขใดเติมจากความจำ ฉบับนี้รวมเนื้อหาทั้งหมดของไฟล์ฉบับ 20 ต.ค. 2026 แล้วเขียนบทที่ค้างต่อ</p>
<p>ข้อความที่ไม่ได้อ้างแหล่งข้อกำหนดคือหลักการวิศวกรรมทั่วไป ไม่ใช่ข้อกำหนดของมาตรฐานใด หนังสือเล่มนี้ไม่ใช้แทนการออกแบบและลงนามรับรองโดยวิศวกรผู้ได้รับใบอนุญาต</p>
<p><strong>การแก้ไขจากไฟล์เดิม:</strong></p>
<ul>

</ul>
<p><strong>การตรวจรอบ 22 ต.ค. 2026:</strong> เปิดเอกสารต้นฉบับใหม่จากแหล่งอื่นที่เปิดได้ แล้วปรับเนื้อหาตามต้นฉบับ</p>

</ul>
</li>
<li><strong>ค่าที่คำนวณ:</strong> ทุกค่าในเล่มคำนวณซ้ำด้วยสคริปต์ Python แล้ว ไม่พบข้อผิดพลาด</li>
<li><strong>ส่วนที่ยังยืนยันจากต้นฉบับไม่ได้</strong> (สหพันธ์ไม่ได้เขียนไว้หรือเปิดเอกสารไม่ได้) รวบไว้ในรายการท้ายเล่ม</li>
</ul>
<p><strong>การตรวจรอบ 23 ต.ค. 2026:</strong> ตรวจเลขคำนวณ ความสอดคล้องข้ามบท และป้ายในภาพสามมิติทั้งเล่มอีกครั้ง ไม่พบตัวเลขผิด แก้ข้อความที่ขัดกันระหว่างบท เปลี่ยนบทบาสเกตบอลเป็น FIBA 2026 ฉบับเต็ม เทียบกฎข้อ 1 กับ PDF ของ IFAB และเพิ่มรายการตรวจส่งมอบของเทนนิสและรักบี้ จากนั้นเทียบกับไฟล์ต้นฉบับที่ได้รับเพิ่ม 4 ฉบับ (BWF Laws V2.1, World Rugby Laws 2026, WBSC 2025-2026 และ FIA Appendix H 2026) แล้วเติมค่าลงในบทที่ 5, 7, 10 และ 12</p>

<li><strong>พื้นที่ก่อสร้างรวม:</strong> รวมระบบระบายน้ำ ทางเดิน รั้ว และงานประกอบ ขึ้นกับโครงการ</li>

<template id="t-c2"><p>บทนี้อธิบายหลักการและสูตรมาตรฐานของตำราวิศวกรรม ไม่มีค่าเกณฑ์ยอมรับของสนามใดสนามหนึ่ง ค่าสัมประสิทธิ์ ปริมาณฝน และเกณฑ์การบดอัดที่ใช้จริงต้องมาจากมาตรฐานและผลสำรวจของโครงการ ตัวเลขในตัวอย่างเป็นข้อมูลสมมติเพื่อการเรียนรู้เท่านั้น</p>
<h3 id="c2-s1">2.1 ลำดับงานสำรวจและออกแบบพื้นที่</h3>
<ol>
<li>สำรวจภูมิประเทศและทำแผนที่ระดับ ทิศทางการไหลของน้ำ และสิ่งกีดขวาง</li>
<li>เจาะสำรวจดินและวัดระดับน้ำใต้ดิน จำนวนและความลึกหลุมเจาะกำหนดตามขนาดและความเสี่ยงของโครงการ</li>
<li>ทดสอบดินในห้องปฏิบัติการ เช่น ขนาดคละ ขีดพิกัดเหลว ความหนาแน่นแห้งสูงสุด</li>
<li>ออกแบบระดับสนาม ดินตัด ดินถม และชั้นรองพื้น</li>
<li>ออกแบบระบบระบายน้ำผิวและใต้ผิว</li>
</ol>
<p>สภาพดินเป็นตัวแปรหลักของต้นทุน ดินเหนียวอ่อนมักต้องปรับปรุงดินหรือรอการทรุดตัว ส่วนดินทรายระบายน้ำดีแต่อาจต้องเพิ่มการบดอัดและการกักเก็บความชื้นของผิวสนาม</p>
<h3 id="c2-s2">2.2 ปริมาณดินตัดและดินถม</h3>
<p>วิธีพื้นที่หน้าตัดเฉลี่ย (average end area)</p>
<div class="math"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>V</mi><mo>=</mo><mfrac><mrow><msub><mi>A</mi><mn>1</mn></msub><mo>+</mo><msub><mi>A</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mo>×</mo><mi>L</mi></mrow><annotation encoding="application/x-tex">V = \frac{A_1 + A_2}{2} \times L</annotation></semantics></math></span></div><p>เมื่อ V คือปริมาตร (m³), A₁ และ A₂ คือพื้นที่หน้าตัดที่สองปลาย (m²), L คือระยะระหว่างหน้าตัด (m)</p>
<p>ตัวอย่างสมมติ: A₁ = 12 m², A₂ = 18 m², L = 20 m → V = (12 + 18) / 2 × 20 = 300 m³ (ปริมาตรในสภาพธรรมชาติ ยังไม่คิดการหดหรือขยายตัวของดิน)</p>
<h3 id="c2-s3">2.3 การบดอัด</h3>
<p>ความแน่นสัมพัทธ์ที่ตรวจในสนามเทียบกับการทดสอบบดอัดในห้องปฏิบัติการ</p>
<div class="math"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>R</mi><mi>C</mi><mo>=</mo><mfrac><msub><mi>γ</mi><mrow><mi>d</mi><mo separator="true">,</mo><mi>f</mi><mi>i</mi><mi>e</mi><mi>l</mi><mi>d</mi></mrow></msub><msub><mi>γ</mi><mrow><mi>d</mi><mo separator="true">,</mo><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mfrac><mo>×</mo><mn>100</mn></mrow><annotation encoding="application/x-tex">RC = \frac{\gamma_{d,field}}{\gamma_{d,max}} \times 100</annotation></semantics></math></span></div><p>เมื่อ γd,field คือความหนาแน่นแห้งที่วัดในสนาม และ γd,max คือค่าสูงสุดจากการทดสอบบดอัด (หน่วยเดียวกัน เช่น t/m³)</p>
<p>ตัวอย่างสมมติ: γd,field = 1.80 t/m³, γd,max = 1.90 t/m³ → RC = 94.7% ว่าผ่านหรือไม่ผ่านต้องเทียบกับเกณฑ์ในรายการประกอบแบบของโครงการ ไม่มีค่ากลางที่ใช้ได้กับทุกโครงการ</p>
<h3 id="c2-s4">2.4 การระบายน้ำ</h3>
<p>อัตราการไหลสูงสุดจากพื้นที่เล็กประมาณด้วยวิธีเหตุผล (Rational Method) ในหน่วย SI</p>
<div class="math"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>Q</mi><mo>=</mo><mfrac><mrow><mi>C</mi><mtext> </mtext><mi>i</mi><mtext> </mtext><mi>A</mi></mrow><mn>360</mn></mfrac></mrow><annotation encoding="application/x-tex">Q = \frac{C \, i \, A}{360}</annotation></semantics></math></span></div><p>เมื่อ Q คืออัตราการไหล (m³/s), C คือสัมประสิทธิ์น้ำท่า (ไม่มีหน่วย), i คือความเข้มฝน (mm/h), A คือพื้นที่รับน้ำ (ha)</p>
<p>ตัวอย่างสมมติ: A = 8,740 m² = 0.874 ha, C = 0.5, i = 100 mm/h → Q = 0.5 × 100 × 0.874 / 360 = 0.121 m³/s หรือประมาณ 121 L/s</p>
<p>ค่า C และ i ข้างต้นเป็นเพียงตัวอย่าง ค่าที่ใช้จริงต้องมาจากข้อมูลฝนท้องถิ่น คาบการเกิดซ้ำที่เจ้าของงานกำหนด และชนิดผิวสนาม</p>
<p>ความเร็วในท่อหรือรางที่ไหลเต็มตามสมการแมนนิง</p>
<div class="math"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>V</mi><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><msup><mi>R</mi><mrow><mn>2</mn><mi mathvariant="normal">/</mi><mn>3</mn></mrow></msup><msup><mi>S</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">V = \frac{1}{n} R^{2/3} S^{1/2}</annotation></semantics></math></span></div><p>เมื่อ V คือความเร็ว (m/s), n คือสัมประสิทธิ์ความขรุขระ, R คือรัศมีชลศาสตร์ (m), S คือความลาดเอียงของท้องท่อ (m/m)</p>
<p><strong>ข้อมูลฝนออกแบบของไทย (รอบตรวจ 22 ต.ค. 2026):</strong></p>
<ul>
<li><strong>กราฟอ้างอิง:</strong> งานวิจัยไทยอ้างกราฟความเข้มฝน-ช่วงเวลา-ความถี่ (IDF) จากการวิเคราะห์ของกรมชลประทาน (Bumpenkit, 1999) เป็นมาตรฐาน มี 59 ชุดครอบคลุมทั้งประเทศ (ก่อนหน้านั้น Mustonen, 1969 เสนอไว้ 14 ชุด) ยังไม่พบรายงานฉบับเต็มของกรมชลประทานหรือกรมอุตุนิยมวิทยาที่เปิดอ่านออนไลน์ได้</li>
<li><strong>ค่าตัวอย่างภาคกลาง:</strong> บทความ <em>Temporal change of extreme precipitation intensity–duration–frequency relationships in Thailand</em> (Journal of Water and Climate Change 13(2): 839, 2022) ยกค่าจากกราฟของกรมชลประทานไว้ เช่น ช่วง 1 ชั่วโมง คาบการเกิดซ้ำ 2 ปี = 48.4 คาบ 100 ปี = 100.8 และช่วง 15 นาที คาบ 2 ปี = 96.3 (ส่วนที่อ่านได้ไม่ระบุหน่วย น่าจะเป็น mm/h)</li>
<li><strong>แนวโน้ม:</strong> บทความเดียวกันเทียบกับสถานีวัดฝนอัตโนมัติ 49 สถานี (ส่วนใหญ่ปี 1990–2015) พบว่าความเข้มฝนสุดขีดส่วนใหญ่ไม่ได้สูงขึ้นจากกราฟเดิม ภาคกลางและภาคตะวันออกมีสัดส่วนค่าที่สูงขึ้นมากที่สุด (31 และ 34 จาก 81 ค่า)</li>
<li><strong>เทียบกับตัวอย่างข้างต้น:</strong> i = 100 mm/h อยู่ในลำดับเดียวกับฝน 1 ชั่วโมง คาบ 100 ปีของภาคกลาง</li>
<li><strong>การใช้งาน:</strong> ค่าเหล่านี้ใช้ดูลำดับขนาดเท่านั้น งานออกแบบจริงต้องขอกราฟ IDF ของสถานีใกล้โครงการจากกรมชลประทานหรือกรมอุตุนิยมวิทยา และใช้คาบการเกิดซ้ำตามที่เจ้าของงานกำหนด</li>
</ul>

<h3 id="c2-s6">2.6 การตรวจมุมฉากของผังสนาม</h3>
<p>สนามสี่เหลี่ยมผืนผ้าต้องมีเส้นทแยงมุมสองเส้นยาวเท่ากัน ความยาวคำนวณได้จาก</p>
<div class="math"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>d</mi><mo>=</mo><msqrt><mrow><msup><mi>L</mi><mn>2</mn></msup><mo>+</mo><msup><mi>W</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding="application/x-tex">d = \sqrt{L^2 + W^2}</annotation></semantics></math></span></div><p>ตัวอย่าง: L = 105 m, W = 68 m → d = √(11,025 + 4,624) = √15,649 = 125.10 m</p>
<p>ค่าคลาดเคลื่อนที่ยอมรับได้ให้กำหนดตามข้อกำหนดโครงการและมาตรฐานที่บังคับใช้ เกณฑ์ปฐมภูมิที่พบมีเฉพาะหญ้าเทียมฟุตบอล คือตำแหน่งเส้น ±50 mm และแนวขอบสนาม ±25 mm (FIFA Code of Practice 2023 หัวข้อ 3.8)</p>
<h3 id="c2-s7">2.7 กฎหมายอาคารของไทยที่เกี่ยวข้อง (เท่าที่เปิดตรวจ)</h3>
<p>รอบตรวจ 22 ต.ค. 2026 เปิดอ่านกฎหมายไทยได้ 3 ฉบับ คือสองฉบับแรกด้านล่าง และกฎกระทรวงการออกแบบโครงสร้าง พ.ศ. 2566 ท้ายหัวข้อ</p>
<p>ที่ยังไม่ได้เปิดตรวจ: มอก. มาตรฐาน วสท. และกฎกระทรวงด้านอัคคีภัยและทางหนีไฟ (เช่น กฎกระทรวงฉบับที่ 55 พ.ศ. 2543 ซึ่งพบชื่อและการแก้ไขโดยกฎกระทรวงฉบับที่ 61 แต่ยังไม่ได้อ่านข้อความเต็ม)</p>

<template id="t-c3"><p>กติกาให้ช่วงขนาดสนามที่ยอมรับได้ ไม่ใช่ขนาดเดียว สนามนานาชาติแคบกว่าช่วงทั่วไป และ 105 × 68 m เป็นค่าที่ FIFA &quot;แนะนำ&quot; ไม่ใช่ข้อบังคับของกติกา</p>
<h3 id="c3-s1">3.1 ข้อมูลทั่วไปและหน่วยงานมาตรฐาน</h3>
<ul>
<li><strong>IFAB</strong> (International Football Association Board) กำหนดกติกาการแข่งขัน กฎข้อ 1 ว่าด้วยสนาม ฉบับที่ใช้ในบทนี้คือ Laws of the Game 2026-27</li>
<li><strong>FIFA</strong> เผยแพร่คู่มือสนามกีฬา (Football Stadiums Guidelines) และโปรแกรมรับรองคุณภาพหญ้าเทียมและประตู</li>
<li><strong>ผู้จัดการแข่งขัน</strong> เลือกขนาดสนามภายในช่วงที่กติกากำหนด</li>

</ul>
<p>ตำราแบ่งระดับการใช้งานเป็นสนามฝึกซ้อม สนามแข่งขันทั่วไป สนามระดับชาติ และสนามนานาชาติ ส่วนเอกสารที่ใช้ได้แบ่งดังนี้</p>
<ul>
<li>กฎข้อ 1 ให้ช่วงทั่วไปและช่วงนานาชาติ (หัวข้อ 3.2)</li>

<p>ไม่มีเอกสารฉบับใดกำหนดขนาดสนามเฉพาะระดับ &quot;ฝึกซ้อม&quot; หรือ &quot;ระดับชาติ&quot; แยกออกมา</p>

<ul>
<li>จุดตัด: y = 34 ± 7.3125 = 26.69 และ 41.31 m</li>
<li>มุมครึ่งของส่วนโค้งเทียบกับแกนกลาง = arccos(5.5 / 9.15) ≈ 53.0° รวมทั้งส่วนโค้งประมาณ 106.1°</li>
</ul>
<p>ตรวจความสมเหตุสมผล:</p>
<ul>
<li>ระยะระหว่างจุดตัดทั้งสอง = 2 × 7.3125 = 14.625 m น้อยกว่าความกว้างเขตโทษ 40.32 m ตามที่ควรเป็น</li>
<li>ความกว้างเขตโทษ = 7.32 + 2 × 16.5 = 40.32 m</li>
<li>ความกว้างเขตประตู = 7.32 + 2 × 5.5 = 18.32 m</li>
</ul>
<figure class="widget-card"><div class="widget" data-w="b0374b1a-a556" aria-label="สนามฟุตบอลสามมิติ"></div><figcaption><span>สนามฟุตบอลสามมิติ</span><em>ลากเพื่อหมุน 360°</em></figcaption></figure>
<p>แบบสามมิตินี้วาดจากตารางพิกัดด้านบน ป้ายขนาดแต่ละองค์ประกอบอยู่ในสนามและเคลื่อนตามมุมมอง ป้ายที่จะทับกันในบางมุมจะซ่อนชั่วคราวและกลับมาเมื่อหมุนต่อ ลากซ้ายขวาเพื่อหมุนรอบสนาม ลากขึ้นลงเพื่อเปลี่ยนมุมก้ม ปุ่ม “มองจากด้านบน” ให้ผังแบบสองมิติตามมาตราส่วน ส่วนโค้งเขตโทษตัดเส้นหน้าเขตโทษที่ y = 26.69 และ 41.31 m ตามที่คำนวณไว้ และแถบเขียวเข้มรอบสนามกว้าง 2 m ให้พื้นที่ 109 × 72 m ตรงกับตารางในหัวข้อ 3.4 มุมที่หมุนไว้จะกลับเป็นมุมเริ่มต้นเมื่อเปิดหน้าใหม่</p>
<h3 id="c3-s6">3.6 เส้นสนามและวิธีตีเส้น</h3>
<p><strong>ที่ยืนยันจากกติกา</strong></p>
<ul>
<li>ลากเฉพาะเส้นที่กฎข้อ 1 กำหนดบนพื้นที่เล่น หากเป็นหญ้าเทียมอนุญาตให้มีเส้นอื่นได้ถ้าสีต่างและแยกจากเส้นฟุตบอลได้ชัดเจน</li>
<li>เส้นต้องต่อเนื่องและไม่เป็นอันตราย สนามหญ้าธรรมชาติอาจใช้วัสดุหญ้าเทียมทำเส้นได้ถ้าไม่เป็นอันตราย</li>
<li>เส้นทุกเส้นกว้างเท่ากัน ไม่เกิน 12 cm</li>
</ul>
<p><strong>หลักปฏิบัติทางวิศวกรรมทั่วไป (ไม่ใช่ข้อกำหนดของมาตรฐาน)</strong></p>
<ol>
<li>ตั้งแนวอ้างอิงจากเส้นฐานที่สำรวจ แล้ววางมุมสนามทั้งสี่ด้วยกล้องสำรวจหรือ GNSS</li>
<li>ตรวจความเป็นสี่เหลี่ยมผืนผ้าด้วยเส้นทแยงมุมสองเส้นต้องยาวเท่ากัน สนาม 105 × 68 m ได้ 125.10 m (สูตรในหัวข้อ 2.6)</li>
<li>วางจุดควบคุมกลางสนามและจุดโทษจากพิกัดในหัวข้อ 3.5 แล้ววัดระยะสัมพัทธ์ซ้ำ</li>
<li>วาดส่วนโค้งด้วยสายวัดที่ยึดกับจุดศูนย์กลางหรือคำนวณพิกัดจุดบนส่วนโค้ง</li>
<li>ตรวจตำแหน่งสุดท้ายก่อนทาสีหรือฝังเส้น และบันทึกผลเทียบกับพิกัดออกแบบ</li>
</ol>
<p><strong>ค่าคลาดเคลื่อนของเส้นสนามหญ้าเทียม</strong> ตาม FIFA Code of Practice 2023 ข้อ 12.1.3 (หัวข้อ 3.8):</p>
<ul>
<li>เส้นกว้าง 100–120 mm</li>
<li>ตำแหน่งคลาดเคลื่อนได้ ±50 mm</li>
<li>ความตรงเบี่ยงได้ไม่เกิน 10 mm ในระยะ 30 m</li>
</ul>
<p>สนามหญ้าธรรมชาติ วัสดุและสีตีเส้น และมาตรฐานเครื่องมือสำรวจ ไม่พบเกณฑ์ตัวเลขของ IFAB หรือ FIFA ต้องกำหนดในข้อกำหนดของโครงการ (อาจใช้ค่าข้างต้นเป็นเกณฑ์เทียบเคียง ตีความ)</p>
<h3 id="c3-s7">3.7 ส่วนที่ 5–11 ของบทสนามฟุตบอล</h3>
<p>ส่วนนี้ปรับใหม่ให้ใช้เอกสาร FIFA ฉบับปัจจุบันสองฉบับที่เปิดอ่านได้ครบ ค่าทั้งหมดในส่วนที่ 5–9 และ 11 มาจากสองฉบับนี้</p>
<ol>
<li><strong>FIFA Quality Programme for Football Turf – Test Manual II: Test Requirements ฉบับ 2024 (มีผล 15 เม.ย. 2024 เอกสารรุ่น Version April 2026)</strong> สำหรับหญ้าเทียม</li>
<li>FIFA Natural-Pitch Rating System ฉบับ พ.ค. 2022 (v1.0) สำหรับหญ้าธรรมชาติ</li>
</ol>
<p>หมายเหตุ:</p>
<ul>
<li><strong>ฉบับ 2015:</strong> ฉบับก่อนหน้าของส่วนนี้ใช้คู่มือหญ้าเทียม 2015 คู่มือ 2024 ข้อ 2.6 ระบุว่ายังใช้ได้ในช่วงเปลี่ยนผ่านจนกว่าจะประกาศวันหมดอายุ แต่ฉบับ 2024 เป็นเอกสารหลักแล้ว ค่าที่เปลี่ยนจาก 2015 อยู่ในหมายเหตุใต้ตาราง</li>
<li><strong>มาตรฐานไทย</strong> (มอก. และ วสท.) ยังเปิดตรวจไม่ได้ ส่วนกฎกระทรวงที่เปิดได้แล้วอยู่ในหัวข้อ 2.7 คู่มือ 2024 ระบุว่าถ้ามีมาตรฐานแห่งชาติครอบคลุมเกณฑ์การออกแบบก่อสร้าง ให้มาตรฐานแห่งชาติมาก่อน Code of Practice ของ FIFA</li>
</ul>
<h4 id="c3-s8">ส่วนที่ 5 การสำรวจและเตรียมพื้นที่</h4>
<ul>
<li><strong>กำลังรับน้ำหนัก:</strong> ชั้นดินเดิมและดินรองพื้นต้องรับน้ำหนักผิวสนามและเครื่องจักรบำรุงรักษาได้ ประเมินด้วยวิธีใน Code of Practice for the Design, Construction and Testing of Football Turf Fields ของ FIFA และ FIFA สงวนสิทธิ์เพิกถอนใบรับรองถ้ากำลังรับน้ำหนักไม่พอ (ภาคผนวก ข้อ 2 Bearing capacity) Code of Practice ฉบับ 2023 เปิดอ่านแล้ว ค่าชั้นดินและชั้นฐานอยู่ในหัวข้อ 3.8 (เช่น CBR ดินเดิมอย่างน้อย 5% และ LWD ชั้นฐานอย่างน้อย 40 MPa)</li>
<li><strong>สิ่งอันตราย:</strong> ต้องไม่มีภายใน 3 m รอบขอบสนาม ไม่มีหัวสปริงเกอร์โผล่ในพื้นที่เล่น และไม่มีเบ้าเสาประตูเปิดโล่ง (ข้อ 5.12)</li>
<li><strong>พื้นที่วิ่งเลย (run-off):</strong> FIFA นิยามไว้อย่างน้อย 3 m เริ่มจากขอบนอกเส้นประตูและเส้นข้าง และแนะนำอย่างน้อย 3 m ต่อด้านเมื่อไม่มีระเบียบการแข่งขันกำหนด แต่ระยะ run-off ไม่ใช่ส่วนหนึ่งของเกณฑ์รับรอง (ข้อ 6.1 และ 7.1)</li>
<li><strong>ข้อสังเกต:</strong> คู่มือสนามกีฬา FIFA ในหัวข้อ 3.4 ให้ผิวเรียบอย่างน้อย 2 m ส่วนคู่มือหญ้าเทียมใช้ 3 m เอกสารสองฉบับมีวัตถุประสงค์ต่างกัน เมื่อจะขอรับรองหญ้าเทียมควรใช้ค่าที่มากกว่า (3 m)</li>
<li><strong>ขนาดสนามที่ขอรับรอง:</strong> FIFA QUALITY 90–120 × 45–90 m ส่วน FIFA QUALITY PRO ต้องอยู่ในช่วงนานาชาติ 100–110 × 64–75 m และห้ามมีโลโก้หรือเครื่องหมายอื่นนอกจากที่กติกากำหนด (ข้อ 6.1–6.2)</li>
<li><strong>ขั้นตอนสำรวจดินและวัดระดับ:</strong> ดูหัวข้อ 2.1</li>
</ul>
<h4 id="c3-s9">ส่วนที่ 6 วัสดุและชั้นพื้นสนาม</h4>

</table></div><h4 id="c3-s10">ส่วนที่ 7 หลักการออกแบบ</h4>
<ul>
<li><strong>การระบายน้ำ:</strong> ระบบหญ้าเทียมทั้งระบบต้องซึมน้ำ &gt; 180 mm/h หญ้าธรรมชาติได้คะแนน &quot;ดีเยี่ยม&quot; เมื่อซึมน้ำ &gt; 150 mm/h และ &quot;ใช้ไม่ได้&quot; เมื่อ &lt; 40 mm/h</li>
<li><strong>ปริมาณน้ำผิวที่ต้องระบาย:</strong> คำนวณด้วยวิธีเหตุผลและข้อมูลฝนออกแบบของไทย (กราฟ IDF ของกรมชลประทาน) ในหัวข้อ 2.4 หญ้าเทียมต้องระบายน้ำผิวได้มากกว่า 180 mm/h (หัวข้อ 3.8)</li>
<li><strong>ความเรียบ:</strong> ช่องว่างใต้ไม้บรรทัดต้องน้อยกว่า 10 mm สำหรับหญ้าเทียม (ตาราง 4 FIFA Test Method 2024-08) และเป็นเกณฑ์ &quot;ไม่มีข้อกังวล&quot; ของหญ้าธรรมชาติ</li>
<li><strong>ความลาดระบายน้ำของผิวสนาม:</strong> คู่มือสนามกีฬาของ FIFA ระบุเพียงว่าสนามต้องราบ (หัวข้อ 3.4) ส่วนสนามหญ้าเทียม FIFA Code of Practice 2023 ให้ความลาดผิว 0.5–1% ในทิศใดก็ได้ (หัวข้อ 3.8)</li>
<li><strong>แสงสะท้อน:</strong> ห้ามวัสดุหรือโครงสร้างที่ทำให้เกิดแสงสะท้อนเข้าตาผู้เล่นและเจ้าหน้าที่ (ภาคผนวก ข้อ 3 Glare)</li>
<li><strong>สปริงเกอร์ในพื้นที่เล่น:</strong> FIFA ไม่สนับสนุน ถ้ามีต้องทดสอบการดูดซับแรงและการยุบตัวเหนือหัวสปริงเกอร์ 2 จุด (ฝั่งละจุด) ให้ผ่านเกณฑ์เดียวกับสนาม (ข้อ 5.9)</li>
</ul>
<h4 id="c3-s11">ส่วนที่ 8 ขั้นตอนก่อสร้าง (ลำดับการรับรองหญ้าเทียม)</h4>
<ol>
<li>ทดสอบผลิตภัณฑ์ในห้องปฏิบัติการที่ FIFA รับรองตามตาราง 1–3 ของคู่มือ</li>
<li>ติดตั้งด้วยองค์ประกอบเดียวกับที่ทดสอบ ผู้ใช้ต้องได้รับใบแจ้งผลิตภัณฑ์และเอกสารวิธีการตามสัญญาผู้ได้รับอนุญาตของ FIFA</li>
<li>ทดสอบสนามจริงโดยช่างทดสอบที่ FIFA รับรอง เก็บตัวอย่างวัสดุเทียบกับผลห้องปฏิบัติการ (ตาราง 5–6) และส่งรายงานผ่านฐานข้อมูลออนไลน์ของ FIFA</li>
<li>FIFA ออกใบรับรองให้ &quot;สนาม&quot; ไม่ใช่ให้ผลิตภัณฑ์</li>
</ol>
<p><strong>เกณฑ์ตรวจด้วยสายตาระหว่างทดสอบสนาม (ข้อ 5.12):</strong></p>
<ul>
<li>รอยต่อเปิดไม่เกิน 3 mm</li>
<li>ไม่มีเส้นขนเป็นห่วงหรือพรมย่น</li>
<li>ความสูงวัสดุโรยระหว่างจุดต่ำสุดกับสูงสุดต่างกันไม่เกิน 10 mm</li>
<li>ไม่มีหัวสปริงเกอร์หรือเบ้าเสาประตูเปิดโล่ง</li>
<li>เส้นสนามต้องตรง</li>
</ul>
<p><strong>หลักฐานที่ผู้รับใบอนุญาตต้องเก็บ</strong> และส่งพร้อมแบบและ BOQ เมื่อ FIFA ร้องขอ (ภาคผนวก ข้อ 15): ความหนาและความหนาแน่นชั้นฐานหลังบดอัด ความยาวท่อระบาย และปริมาณวัสดุทุกรายการตามใบส่งของ</p>

<h3 id="c3-s15">3.8 งานโยธาใต้หญ้าเทียม (FIFA Code of Practice 2023)</h3>

</tr>

</tr>
<tr>
<td>การระบายน้ำผิว (9.2)</td>
<td>มากกว่า 180 mm/h</td>
</tr>

<td>ท่อแขนง ≥ 50 mm ห่างกัน ≤ 7 m หรือ ≥ 80 mm ห่างกัน ≤ 10 m ความลาดต่ำสุด 0.5% ท่อรวมรอบสนาม ≥ 100 mm ที่ 0.5% หรือ ≥ 125 mm ที่ 0.3% ร่องท่อลึก = เส้นผ่านศูนย์กลางท่อ + 150 mm กว้างอย่างน้อย 3 เท่าของเส้นผ่านศูนย์กลางท่อ</td>

<p>ITF Rules of Tennis ไม่ได้กำหนดความหนาชั้นรองพื้น ความลาดเอียงระบายน้ำ หรือเกณฑ์ความเรียบ ข้อกำหนดเหล่านั้นอยู่ในเอกสารอื่นของ ITF (เช่น ITF Guide to Test Methods และคู่มือสนาม) และมาตรฐานท้องถิ่น ซึ่งยังไม่ได้เปิดตรวจ ฉบับนี้จึงระบุเพียงหลักการตามบทที่ 2</p>
<ul>
<li>พื้นแข็งอะคริลิกต้องการฐานแข็งแรงและคงรูป (แอสฟัลต์หรือคอนกรีต) จึงต้องคุมการทรุดตัวและรอยต่อ</li>
<li>สนามดินเหนียวและหญ้าต้องมีชั้นระบายน้ำใต้ผิวสนาม</li>
<li>ความหนาแต่ละชั้น ความลาดเอียง และค่าคลาดเคลื่อน ต้องออกแบบและตรวจสอบเพิ่มเติมตามผลสำรวจดินและข้อกำหนดโครงการ</li>
</ul>

<h3 id="c7-s5">7.5 โครงสร้างพื้นและการก่อสร้าง</h3>

<p>งานโยธาที่สำคัญคือคุมระดับให้เส้นเบสและโฮมเพลตอยู่ระดับเดียวกัน ขณะที่ส่วนอื่นของสนามยังระบายน้ำได้ ต้องออกแบบและตรวจสอบเพิ่มเติมตามบทที่ 2</p>

<li>ยังไม่คิดระยะ 1 m จากสิ่งกีดขวาง หากปลายช่องเป็นผนัง</li>
</ul>
<figure class="widget-card"><div class="widget" data-w="547a5663-9b23" aria-label="ช่องเล่นเปตองสามมิติ"></div><figcaption><span>ช่องเล่นเปตองสามมิติ</span><em>ลากเพื่อหมุน 360°</em></figcaption></figure>

<h3 id="c8-s4">8.4 ระยะจากผนังและแผงกั้น (แนวปฏิบัติของนิวซีแลนด์)</h3>

<p>ค่าที่บังคับจริงคือแผงกั้นห่างเส้นนอกอย่างน้อย 1 m ตามตาราง 8.1</p>
<h3 id="c8-s5">8.5 โครงสร้างพื้นและการก่อสร้าง</h3>
<p>กติกาไม่กำหนดวัสดุผิวสนาม ความหนาชั้นทราย-หินคลุก หรือความลาด เพราะเปตองตั้งใจให้เล่นบนพื้นธรรมชาติที่ไม่สม่ำเสมอ (กติกาไม่มีค่า)</p>
<p>ข้อบังคับที่กระทบงานโยธา:</p>
<ul>
<li>ขนาดช่องขั้นต่ำ</li>
<li>ระยะแผงกั้น</li>
<li>แอ่งน้ำที่ลูกลอยได้ถือเป็นพื้นที่ห้าม สนามกลางแจ้งจึงต้องระบายน้ำผิวได้ดี (ใช้หลักในหัวข้อ 2.4)</li>
</ul>
<p>ความหนาชั้นวัสดุต้องออกแบบโดยวิศวกรตามสภาพดิน</p>

<h3 id="c9-s6">9.6 โครงสร้างพื้นและการก่อสร้าง</h3>
<p>กติกากำหนดว่าพื้นต้องราบ เรียบ ไม่ขัดสี และควรเป็นไม้ แต่กฎข้อ 1 ไม่มีตัวเลขค่าดูดซับแรง การเด้งของลูก หรือความลื่น</p>

<li><strong>FIFA Quality Programme for Futsal Surfaces:</strong> หน้าเว็บ (ปรับปรุง 9 ส.ค. 2021) ระบุว่าโปรแกรมใช้เกณฑ์ที่แคบกว่า EN 14904 (มาตรฐานพื้นกีฬาในร่มของยุโรป) และ FIFA จัดทำ Handbook of Test Methods and Requirements ไว้ แต่หน้าเว็บไม่มีไฟล์ให้ดาวน์โหลด จึงยังไม่ใส่ตัวเลข ผู้ออกแบบควรเลือกผลิตภัณฑ์ที่ผ่านโปรแกรมนี้แทนการกำหนดค่าเอง</li>
<li><strong>โครงสร้างใต้พื้น:</strong> ต้องออกแบบตามบทที่ 2</li>

<li><strong>ฉบับที่ใช้ปี 2025:</strong> ไฟล์ที่ FIA เผยแพร่ในชื่อ appendix_o_2025_published_15.01.2025 เปิดดูแล้วเป็นฉบับเดียวกัน (หัวกระดาษ Appendix O 2024 Published on 23 Dec. 2024) ไม่พบฉบับใหม่กว่าในการค้นครั้งนี้</li>
<li><strong>ใบอนุญาตพิเศษ:</strong> ระดับ E (รถไฟฟ้า) และ T (ทดสอบรถ) ยังมีอยู่ในฉบับนี้</li>
<li><strong>เอกสารอื่น:</strong> การกำกับสนามและอุปกรณ์สัญญาณอยู่ใน Appendix H ฉบับ 2026 (หัวข้อ 12.7) ส่วน &quot;FIA Circuit Guidelines&quot; ไม่พบเป็นเอกสารสาธารณะ</li>
</ul>
<h3 id="c12-s1">12.1 ระดับใบอนุญาตสนาม (ข้อ 6)</h3>
<div class="table-wrap"><table><thead>
<tr>
<th>ระดับ</th>
<th>ประเภทรถ (อัตราส่วนน้ำหนักต่อกำลัง)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>รถที่นั่งเดี่ยวกลุ่ม D และ E น้อยกว่า 1 kg/hp (ระดับที่ต้องมีเพื่อจัด F1)</td>
</tr>
<tr>
<td>2</td>
<td>รถที่นั่งเดี่ยวกลุ่ม D และ E ระหว่าง 1–2 kg/hp</td>
</tr>
<tr>
<td>3</td>
<td>รถประเภท II ระหว่าง 2–3 kg/hp</td>
</tr>
<tr>
<td>4</td>
<td>รถประเภท I และรถประเภท II มากกว่า 3 kg/hp</td>
</tr>
<tr>
<td>5</td>
<td>ใบอนุญาตชั่วคราวสำหรับสนามที่กำลังพัฒนา ไม่ใช้กับรายการนานาชาติ</td>
</tr>
<tr>
<td>6</td>
<td>ออฟโรด: ออโตครอส แรลลี่ครอส แข่งบนน้ำแข็ง</td>
</tr>
<tr>
<td>อายุใบอนุญาต</td>
<td>สูงสุด 3 ปี</td>
</tr>
</tbody>
</table></div><p>ใบอนุญาตระดับ 1–4 ใช้ได้กับรถทุกประเภทของระดับที่ต่ำกว่า ยกเว้นระดับ E สำหรับรถไฟฟ้าซึ่งต้องมีใบอนุญาต E โดยเฉพาะ</p>
<h3 id="c12-s2">12.2 เกณฑ์ออกแบบแนวและหน้าตัดทาง (ข้อ 7.2–7.7)</h3>
<div class="table-wrap"><table><thead>
<tr>
<th>รายการ</th>
<th>ค่า</th>
</tr>
</thead>
<tbody>
<tr>
<td>ความยาวทางตรงสูงสุด</td>
<td>2 km</td>
</tr>
<tr>
<td>ความยาวสนามใหม่</td>
<td>แนะนำไม่เกิน 7 km ความยาวขั้นต่ำตามรายการแข่งอยู่ใน Supplement 2</td>
</tr>
<tr>
<td>ความกว้างทาง (สนามถาวรใหม่)</td>
<td>อย่างน้อย 12 m</td>
</tr>
<tr>
<td>การเปลี่ยนความกว้าง</td>
<td>ค่อยเป็นค่อยไป ไม่เกิน 1 m ต่อ 20 m</td>
</tr>
<tr>
<td>ความกว้างกริดออกตัว</td>
<td>อย่างน้อย 15 m และคงความกว้างนี้ถึงทางออกโค้งแรก</td>
</tr>
<tr>
<td>ความยาวกริดต่อคัน (ออกตัวแบบหยุดนิ่ง)</td>
<td>อย่างน้อย 6 m (F1 ใช้ 8 m)</td>
</tr>
<tr>
<td>เส้นออกตัวถึงโค้งแรก</td>
<td>ควรอย่างน้อย 250 m (โค้ง หมายถึงเปลี่ยนทิศอย่างน้อย 45° รัศมีน้อยกว่า 300 m)</td>
</tr>
<tr>
<td>ความลาดตามยาวของกริดออกตัว</td>
<td>ไม่เกิน 2%</td>
</tr>
<tr>
<td>ความลาดขวางในทางตรง (เพื่อระบายน้ำ)</td>
<td>ระหว่าง 1.5% (0.9°) ถึง 3% (1.7°)</td>
</tr>
<tr>
<td>ความลาดเอียงในโค้ง (banking)</td>
<td>ไม่เกิน 10% (5.7°) ยกเว้นสนามรูปไข่ ลาดกลับด้านไม่ยอมรับโดยทั่วไป</td>
</tr>
<tr>
<td>การเปลี่ยนความลาดตามยาว</td>
<td>ใช้โค้งดิ่งรัศมีเหมาะกับสมรรถนะรถ หลีกเลี่ยงในเขตเบรกความเร็วสูงและในโค้ง</td>
</tr>
</tbody>
</table></div><h3 id="c12-s3">12.3 ขอบทาง ไหล่ทาง และพื้นที่ปลอดภัย (ข้อ 7.6–7.8, 10)</h3>
<div class="table-wrap"><table><thead>
<tr>
<th>รายการ</th>
<th>ค่า</th>
</tr>
</thead>
<tbody>
<tr>
<td>เส้นขอบทาง</td>
<td>เส้นขาวต่อเนื่องสีกันลื่น กว้างอย่างน้อย 10 cm ทั้งสองข้าง</td>
</tr>
<tr>
<td>ไหล่ทาง (verge)</td>
<td>โดยทั่วไปกว้าง 1–5 m ผิวเรียบ ต่อเนื่องกับหน้าตัดทาง ไม่มีขั้นระดับ</td>
</tr>
<tr>
<td>ความลาดพื้นที่ปลอดภัย (run-off)</td>
<td>ขึ้นไม่เกิน 25% (ไม่ใช้กับบ่อกรวด) ลงไม่เกิน 3%</td>
</tr>
<tr>
<td>ความลึกพื้นที่ปลอดภัย</td>
<td>โดยทั่วไปประมาณ 30–100 m ตามความเร็วเข้าโค้ง อยู่ด้านนอกโค้งเป็นหลัก</td>
</tr>
<tr>
<td>แผงกั้นแนวแรก</td>
<td>มุมชนต่ำใช้แผงตั้งต่อเนื่อง มุมชนสูงใช้อุปกรณ์ดูดซับพลังงานหรือแผงหยุดรถ</td>
</tr>
<tr>
<td>ช่องว่างราวกั้น (guardrail)</td>
<td>ระหว่างรางล่างกับพื้นและระหว่างราง ไม่เกิน 4 cm สนามใหม่ตั้งแต่ 2019 ใช้เสาโลหะเท่านั้น</td>
</tr>
<tr>
<td>โครงสร้างข้ามทาง</td>
<td>ระยะโล่งอย่างน้อย 4.5 m ต้องมีวิศวกรรับรองความแข็งแรงและเสถียรภาพ</td>
</tr>
<tr>
<td>แผงไฟสัญญาณเหนือทาง</td>
<td>ขอบล่างสูงไม่น้อยกว่า 2.5 m</td>
</tr>
<tr>
<td>โครงสร้างหลังแผงกั้นแนวแรก</td>
<td>ห่างอย่างน้อย 1 m และไม่กีดขวางรถกู้ภัย</td>
</tr>
<tr>
<td>ป้ายโฆษณาชั่วคราวระหว่างทางกับแผงกั้น</td>
<td>ห่างขอบทางอย่างน้อย 3 m ห้ามโลหะ โฟมไม่ลามไฟหนาไม่เกิน 100 mm ห้ามวางด้านนอกโค้ง</td>
</tr>
<tr>
<td>เลนพิต</td>
<td>กว้างอย่างน้อย 12 m ติดทางตรงออกตัว คั่นด้วยกำแพงพิตและแท่นส่งสัญญาณ</td>
</tr>
<tr>
<td>ระบบระบายน้ำ</td>
<td>ต้องเป็นลำดับแรกในการวางผัง ทั้งทาง เลนพิต แพดด็อก และพื้นที่ผู้ชม ผู้ออกแบบต้องแสดงหลักฐานต่อ FIA</td>
</tr>
</tbody>
</table></div><h3 id="c12-s4">12.4 การวัดความยาวสนาม (ข้อ 8)</h3>
<p>ความยาวทางการคือความยาวแนวกึ่งกลางทาง (เส้นกึ่งกลางระหว่างขอบแอสฟัลต์ซ้ายขวาที่กำหนดด้วยเส้นขาว)</p>
<ul>
<li><strong>วัดในสนาม:</strong> ควรใช้ค่าเฉลี่ยของขอบซ้ายและขวา</li>
<li><strong>คำนวณ:</strong> กำหนดรูปตามแนวราบ (ความยาว รัศมีโค้ง และสมการโค้งต่อเนื่อง) และรูปตัดตามยาวเป็นโค้งดิ่งหรือระดับแนวกึ่งกลางทุกช่วงไม่น้อยกว่า 10 m ความละเอียด 0.01 m แล้วคำนวณความยาวละเอียดถึง 1 m</li>
</ul>
<h3 id="c12-s5">12.5 ตัวอย่างคำนวณ</h3>
<ul>
<li>กริดออกตัว 20 คัน × 6 m = 120 m; F1 22 คัน × 8 m = 176 m ระยะนี้รวมกับ 250 m ถึงโค้งแรก บอกว่าทางตรงออกตัวควรยาวหลายร้อยเมตร</li>
<li>ขยายความกว้างจาก 12 m เป็น 15 m ที่อัตราไม่เกิน 1 m ต่อ 20 m ต้องใช้ระยะอย่างน้อย 3 × 20 = 60 m</li>
<li>ทางกว้าง 12 m ลาดขวางจากกึ่งกลางสองข้าง (crown) 1.5–3% ขอบทางต่ำกว่ากึ่งกลาง 6 × 0.015 ถึง 6 × 0.03 = 0.09–0.18 m ถ้าลาดทางเดียวทั้งหน้าตัด ต่างระดับ 0.18–0.36 m</li>
<li>ความลาดขวางขั้นต่ำ 1.5% คือเกณฑ์ระบายน้ำผิว ส่วนอัตราการไหลไปบ่อพักคำนวณด้วยวิธีเหตุผลในหัวข้อ 2.4 โดยใช้ C ของแอสฟัลต์และข้อมูลฝนท้องถิ่น</li>
</ul>
<h3 id="c12-s6">12.6 โครงสร้างทางและการก่อสร้าง</h3>
<p>Appendix O ไม่กำหนดโครงสร้างชั้นทาง ส่วนผสมแอสฟัลต์ ความเรียบผิว หรือค่าความต้านทานการลื่นของผิวทาง (อ้างเพียงมาตรฐาน FIA 3503-2019 สำหรับสีและโฆษณาบนพื้นที่ปลอดภัยแบบปู)</p>
<ul>
<li>ผู้ตรวจ FIA อาจขอคำรับรองความแข็งแรงของสิ่งติดตั้งความปลอดภัยจากวิศวกรโครงสร้าง</li>
<li>งานชั้นทาง การบดอัด และระบบระบายน้ำต้องออกแบบและตรวจสอบเพิ่มเติมตามบทที่ 2 ร่วมกับมาตรฐานงานทางของประเทศ</li>
</ul>
<h3 id="c12-s7">12.7 การกำกับสนามและอุปกรณ์สัญญาณ (Appendix H 2026)</h3>
<p>Appendix H ของ International Sporting Code ฉบับเผยแพร่ 23 มิ.ย. 2026 (Recommendations for the supervision of the road and emergency services) ให้ค่าที่กระทบผังและงานก่อสร้างดังนี้</p>
<div class="table-wrap"><table><thead>
<tr>
<th>ข้อ</th>
<th>ข้อกำหนด</th>
</tr>
</thead>
<tbody>
<tr>
<td>2.1.2 ห้องควบคุมการแข่งขัน</td>
<td>อยู่ในอาคารพิทฝั่งทางเข้าพิท สูงจากพื้นไม่เกินหนึ่งชั้น</td>
</tr>
<tr>
<td>2.2 ห้องจับเวลา</td>
<td>อยู่ชั้นที่หนึ่งหรือสองเหนือชั้นล่าง (ไม่ใช่ชั้นล่าง) สเปกห้องตาม FIA Timing System Guidelines</td>
</tr>
<tr>
<td>2.3.1 ทางพิท</td>
<td>จำกัดความเร็วไม่เกิน 60 km/h (ยกเว้น F1 และสนามโอวัล)</td>
</tr>
<tr>
<td>2.3.4 จุดมาร์แชลทางพิท</td>
<td>ทางเข้า 1 ทางออก 1 และ 1 คนต่อทุก 10 โรงรถตลอดแนวทางพิท</td>
</tr>
<tr>
<td>2.4.2 จุดมาร์แชล</td>
<td>ห่างกันไม่เกิน 500 m มองเห็นจุดข้างเคียง ทุกช่วงระหว่างแบริเออร์ต้องมีผู้เฝ้า ป้ายจุดกว้าง 40 cm สูง 30 cm เส้นอ้างอิงธงเหลืองกว้าง 10 cm พร้อมหมุดยืดหยุ่นห่างขอบทางประมาณ 1 m</td>
</tr>
<tr>
<td>2.4.3 อุปกรณ์ประจำจุด</td>
<td>วัสดุดูดซับ 10 L ถังดับเพลิงอย่างน้อย 3 ถัง แต่ละถังหนักรวมไม่เกิน 10 kg และมีสารดับเพลิงไม่น้อยกว่า 6 kg เครื่องเป่าลมอย่างน้อย 380 CFM แรงเป่า 9 N ป้าย SC/FCY ตัวอักษรสูง 40 cm บนพื้นอย่างน้อย 60 × 80 cm</td>
</tr>
<tr>
<td>2.5.2 ธง</td>
<td>ขั้นต่ำ 60 × 80 cm ธงแดงและธงหมากรุกอย่างน้อย 80 × 100 cm</td>
</tr>
<tr>
<td>2.5.3 ไฟสัญญาณ</td>
<td>มองเห็นชัดจาก 250 m กลางแดดจ้า กะพริบ 3–4 Hz มุมมองอย่างน้อย 70° (ห้ามใช้ไฟ 360°) อยู่ภายใน 30° จากแนวสายตาหลักของนักขับ</td>
</tr>
<tr>
<td>2.5.4.1 เส้นธงแดง</td>
<td>เส้นสีกันลื่นต่อเนื่องกว้าง 20 cm คร่อมทาง</td>
</tr>
<tr>
<td>2.5.6 a โครงไฟออกตัว</td>
<td>อยู่หลังเส้นออกตัว 10–25 m แถวล่างสูงจากผิวทางอย่างน้อย 4 m ไฟแดงอยู่เหนือไฟเขียวโดยตรง</td>
</tr>
</tbody>
</table></div><p><strong>ข้อ 2.6–2.8 และ Supplement 3–6 (อ่านจากไฟล์ Appendix H 2026 เมื่อ 23 ต.ค. 2026):</strong> ส่วนที่กระทบผังและงานก่อสร้างมีดังนี้</p>
<ul>
<li><strong>2.7.2.3 ป้ายจุดถังดับเพลิงข้างทาง:</strong> ตั้งฉากกับแนวป้องกันแนวแรก สูงจากพื้นประมาณ 2 m</li>
<li><strong>2.7.2.4 พิตเติมเชื้อเพลิง:</strong> ถังดับเพลิงแบบถือพิตละ 1 ถัง และแนะนำให้ติดตั้งชุดถังสองใบ ใบละ 30 kg ทุกพิตที่หก สายยาวสองในสามของระยะถึงชุดถัดไป</li>
<li><strong>2.7.2.5 แพดด็อก:</strong> มีถังดับเพลิงแบบถือพอเพียง และรถดับเพลิงเข้าถึงได้ง่าย</li>
<li><strong>2.8.3.4 ศูนย์การแพทย์:</strong> บังคับทุกสนามที่จัดรายการในปฏิทินนานาชาติของ FIA สนามถาวรระดับ 1–4 ต้องเป็นอาคารถาวร เว้นแต่ได้รับผ่อนผัน สนามชั่วคราวระดับ 1–4 และสนามระดับ 6 ใช้แบบชั่วคราวได้ การผ่อนผันให้เมื่อแผนกฉุกเฉินของโรงพยาบาลที่ FIA รับรองอยู่ใกล้พอ แต่ยังต้องมีหน่วยแพทย์พื้นฐานในสนาม และต้องยื่นขอล่วงหน้าอย่างน้อย 6 เดือน</li>
<li><strong>Supplement 6 ที่ตั้งศูนย์การแพทย์:</strong> อยู่ในเขตสนาม ควรอยู่ตรงกลาง เป็นพื้นที่ปิดมีผู้เฝ้า และห่างทางวิ่งน้อยที่สุด ถ้าทางเข้าอยู่ต้นเลนพิตต้องแยกออกก่อนถึงโรงรถ ถ้าอยู่ปลายเลนพิตต้องอยู่เลยทางออกเลนพิตไปพอสมควร ถ้าต้องมีเฮลิคอปเตอร์ ลานจอดต้องอยู่ติดศูนย์</li>
<li><strong>Supplement 6 ตัวอาคาร:</strong> รักษาผู้บาดเจ็บได้พร้อมกัน 2 คน มีไฟฟ้าสำรอง น้ำร้อนน้ำเย็น ห้องน้ำ และปรับอากาศเมื่อจำเป็น มีจุดกู้ชีพอย่างน้อย 2 จุด จุดรักษาทั่วไปอย่างน้อย 2 จุดแยกจากจุดกู้ชีพ ที่เก็บอุปกรณ์ และห้องตรวจสารต้องห้ามพร้อมห้องน้ำแยก สนาม F1 และ WEC ต้องเพิ่มฝักบัวแรงดันสูงและทางเข้าจุดกู้ชีพแยกเฉพาะ เอกสารไม่กำหนดขนาดห้องเป็นตัวเลข และต้องส่งแบบพร้อมแบบสอบถามของ FIA ให้คณะกรรมาธิการการแพทย์และคณะกรรมาธิการสนามแข่งก่อนก่อสร้างหรือดัดแปลง</li>

<li><strong>พื้นที่และความสูง:</strong> พื้นที่แฮนด์บอล 44 × 22 m ครอบคลุมพื้นที่วอลเลย์บอลรายการ FIVB 31 × 19 m ได้ อาคารอเนกประสงค์จึงใช้แฮนด์บอลกำหนดพื้นที่ และใช้วอลเลย์บอลกำหนดความสูงโล่ง (7 m ทั่วไป หรือ 12.5 m รายการ FIVB) ความสูงนี้วัดถึงสิ่งกีดขวางต่ำสุด เช่น โคมไฟ ท่อแอร์ หรือโครงถัก (ตีความจากคำว่า free playing space)</li>
<li><strong>จุดยึดในพื้น:</strong> เบ้าเสาตาข่ายวอลเลย์บอลฝังพื้นที่ระยะตามตาราง 16.1 และจุดยึดประตูแฮนด์บอลต้องเตรียมไว้ตั้งแต่งานพื้น เพราะกติกาแฮนด์บอลบังคับให้ยึดประตู (ต่างจากฟุตซอลที่ห้ามยึด) ถ้าอาคารใช้ทั้งสองกีฬาต้องแยกระบบยึดให้ถอดออกได้</li>
<li><strong>พื้นกีฬาในร่ม:</strong> FIVB กำหนดเพียงชนิดพื้น (ไม้หรือสังเคราะห์) ส่วน IHF ไม่กำหนดในกฎข้อ 1 ค่าคุณสมบัติพื้น (การดูดซับแรง การยุบตัว การเด้งลูก ความลื่น) ของสองกีฬานี้ไม่ได้เปิดตรวจ และค่าในหัวข้อ 6.6 เป็นของ FIBA จึงใช้แทนไม่ได้ ต้องเลือกพื้นที่ผ่านมาตรฐานพื้นกีฬาในร่มที่เจ้าของโครงการกำหนด และออกแบบพื้นคอนกรีตใต้พื้นกีฬาให้ราบตามที่ผู้ผลิตกำหนด</li>
<li><strong>สนามวอลเลย์บอลกลางแจ้ง:</strong> ความลาดระบายน้ำไม่เกิน 0.5% ตามกฎข้อ 1.2.3 และใช้หลักระบายน้ำในบทที่ 2</li>
</ul>

<p>รูปผิวกรีนสำเร็จกำหนดรูปดินเดิม เพราะ USGA ให้ดินเดิมลาดตามผิวสำเร็จ ชั้นกรวดและดินรากจึงหนาเท่ากันทั้งกรีน การวางผังภูมิทัศน์ (การตัด ถม และรูปเนิน) จึงต้องออกแบบระดับผิวสำเร็จก่อน แล้วลดระดับลงตามความหนาชั้น</p>
<p>ตัวอย่างกรีน 500 m² (คำนวณ ตรวจด้วยสคริปต์แล้ว):</p>
<ul>
<li><strong>ไม่มีชั้นกลาง:</strong> ขุดลึก 0.40 m = 200 m³ ชั้นกรวด 0.10 m = 50 m³ ชั้นดินราก 0.30 m = 150 m³</li>
<li><strong>มีชั้นกลาง 50–100 mm:</strong> ขุดลึก 0.45–0.50 m = 225–250 m³ และใช้วัสดุชั้นกลาง 25–50 m³</li>
</ul>
<p>ปริมาณงานดินทั้งสนามคำนวณด้วยวิธีหน้าตัดเฉลี่ยในหัวข้อ 2.2</p>
<h3 id="c18-s4">18.4 ระบบน้ำ</h3>
<ul>
<li><strong>ระบบรดน้ำกรีน:</strong> ข้อแนะนำ USGA 2018 ไม่มีข้อกำหนดระบบรดน้ำ ระบุเพียงให้รดน้ำหนักหลังวางดินรากเพื่อให้ดินทรุดตัว</li>
<li><strong>การระบายน้ำ:</strong> ค่า Ksat อย่างน้อย 150 mm/h หมายความว่ากรีนระบายน้ำผ่านชั้นดินรากลงชั้นกรวดได้เร็ว น้ำส่วนใหญ่จึงไหลเข้าท่อใต้ดิน ระบบท่อหลักและบ่อพักต้องรับปริมาณน้ำที่คำนวณจากพื้นที่กรีนและความเข้มฝนออกแบบ (หัวข้อ 2.4)</li>
<li><strong>น้ำทั้งสนาม:</strong> ไม่พบมาตรฐานของ USGA หรือ R&amp;A ที่กำหนดระบบรดน้ำทั้งสนามหรือปริมาณน้ำเป็นค่าออกแบบ ข้อมูลอ้างอิงที่มีคือผลสำรวจ GCSAA Golf Course Environmental Profile ปี 2020 ในสหรัฐฯ (1,575 สนาม เผยแพร่ ส.ค. 2022):
<ul>
<li>ค่ามัธยฐานน้ำที่ใช้ต่อสนาม 66.3 acre-feet (ประมาณ 81,800 m³ คำนวณ)</li>
<li>ต่อพื้นที่รดน้ำ 1.01 acre-feet ต่อเอเคอร์ (ความลึกน้ำประมาณ 308 mm คำนวณ)</li>
<li>พื้นที่รดน้ำมัธยฐาน 60.9 เอเคอร์ (ประมาณ 24.6 ha คำนวณ)</li>
<li>บ่อและทะเลสาบเป็นแหล่งน้ำ 55% สนามที่ใช้น้ำรีไซเคิล 12.6% และระบบอัตโนมัติเต็มรูปแบบ 73%</li>
</ul>
</li>
<li><strong>การใช้ค่าเหล่านี้:</strong> สะท้อนภูมิอากาศสหรัฐฯ ใช้เทียบลำดับขนาดเท่านั้น การออกแบบในไทยต้องคำนวณจากค่าคายระเหยของพืชและฝนของพื้นที่ โดยผู้เชี่ยวชาญระบบชลประทานสนามกอล์ฟ</li>
</ul>

<h3 id="c19-s3">19.3 เรขาคณิตส่วนโค้ง (transition)</h3>
<p>ส่วนโค้งแบบวงกลมรัศมี r สูง h (h ≤ r):</p>

<li>ถ้า h &gt; r ส่วนที่เกินคือช่วงตั้งตรงยาว h − r</li>
</ul>

</tr>

</table></div><p>ค่าเหล่านี้เป็นแรงทดสอบอุปกรณ์ ไม่ใช่แรงออกแบบจุดยึดในพื้น</p>
<ul>
<li><strong>เกณฑ์ทดสอบรับ (Apparatus Norms 2026):</strong> จุดยึดพื้นและอุปกรณ์ต่อยึดทุกจุดรับแรงสถิต 8,000 N (+20 N) ในทิศแนวลวดนาน 1 นาทีโดยไม่เสียรูปถาวร ทั้งสนามแข่งและสนามฝึก และ shackle ต้องรับได้อย่างน้อย 10 kN (หัวข้อ 21.6)</li>
<li><strong>แรงออกแบบ:</strong> วิศวกรยังต้องกำหนดเองจากแรงลวดสูงสุดที่อุปกรณ์ทำงาน (ระดับเตือน TCS 5,000 N เป็นขอบเขตบนของการใช้งานปกติ) พร้อมตัวคูณความปลอดภัยตามมาตรฐานการออกแบบที่ใช้บังคับ</li>
<li><strong>ต้องตรวจ:</strong> ทั้งกำลังถอนของสมอยึดและกำลังของพื้นคอนกรีตรอบสมอ</li>
</ul>

<template id="t-c22"><p>ลู่จักรยานเป็นสนามที่เรขาคณิตซับซ้อนที่สุดในเล่ม เพราะผิวลู่เอียงเปลี่ยนมุมต่อเนื่องจากทางตรงเข้าทางโค้ง</p>
<ul>
<li><strong>ระเบียบ:</strong> UCI Part 3 Track Races ฉบับมีผล 1 ม.ค. 2026 บทที่ VI § 6 Velodromes (มาตรา 3.6.064–3.6.101) จากไฟล์ต้นฉบับที่ได้รับในรอบตรวจ 22 ต.ค. 2026 ไฟล์นี้เป็นฉบับแสดงการแก้ไข (ข้อความใหม่สีแดง ข้อความที่ยกเลิกขีดฆ่า) ตาราง 22.1 ใช้เฉพาะข้อความที่มีผล</li>
<li><strong>แบบจำลองเรขาคณิต (หัวข้อ 22.2):</strong> บทความ <em>On technical considerations of UCI-regulated velodrome track design</em> (arXiv:2207.13556, 2022) ซึ่งอ้างมาตรา 3.6.067–3.6.081 ไว้ตรงกับต้นฉบับ ยกเว้นชื่อประเภทลู่ที่ฉบับ 2026 เปลี่ยนจาก Category 1–4 เป็น Category A และ B</li>
<li><strong>ก่อนออกแบบจริง:</strong> ตรวจว่า UCI ออกฉบับใหม่กว่า 1 ม.ค. 2026 หรือไม่</li>
</ul>
<h3 id="c22-s1">22.1 ข้อกำหนดลู่ของ UCI</h3>
<div class="table-wrap"><table><thead>
<tr>
<th>มาตรา (UCI 2026)</th>
<th>ข้อกำหนด</th>
</tr>
</thead>
<tbody>
<tr>
<td>3.6.066 โครงสร้าง</td>
<td>ความมั่นคงและความแข็งแรงของวัสดุและจุดยึดต้องเป็นไปตามกฎหมายก่อสร้างและความปลอดภัยของประเทศที่สร้าง โดยคำนึงถึงสภาพธรณีวิทยาและภูมิอากาศ เป็นความรับผิดชอบของเจ้าของ ผู้รับเหมา สถาปนิก และวิศวกร การรับรองของ UCI ตรวจเฉพาะลักษณะภายนอกตามบทนี้ ไม่รับรองโครงสร้าง</td>
</tr>
<tr>
<td>3.6.067 รูปลู่</td>
<td>ขอบในประกอบด้วยโค้งสองโค้งต่อด้วยทางตรงขนานสองช่วง ทางเข้าและออกโค้งต้องเปลี่ยนอย่างค่อยเป็นค่อยไป มุมเอียงกำหนดจากรัศมีโค้งและความเร็วสูงสุดของแต่ละประเภทการแข่ง</td>
</tr>
<tr>
<td>3.6.068 ความยาว</td>
<td>133–500 m จำนวนรอบเต็มหรือครึ่งรอบต้องได้ระยะ 1 km พอดี คลาดได้ +5 cm ชิงแชมป์โลกและโอลิมปิกต้องยาว 250 m</td>
</tr>
<tr>
<td>3.6.069 การวัด</td>
<td>วัดที่ 20 cm เหนือขอบในของลู่ (ขอบบนของแถบสีฟ้า)</td>
</tr>
<tr>
<td>3.6.070 ความกว้าง</td>
<td>คงที่ตลอดความยาว ลู่ Category A กว้างอย่างน้อย 7 m ลู่ Category B กว้างตามสัดส่วนความยาว อย่างน้อย 5 m (ฉบับ 2026 เปลี่ยนจาก Category 1–2)</td>
</tr>
<tr>
<td>3.6.071 แถบสีฟ้า</td>
<td>ขี่ได้ สีฟ้า กว้างอย่างน้อย 10% ของความกว้างลู่ ผิวคุณสมบัติเดียวกับลู่ ห้ามโฆษณา ไม่นับเป็นผิวแข่ง (3.2.008)</td>
</tr>
<tr>
<td>3.6.072 เขตปลอดภัย</td>
<td>อยู่ด้านในแถบสีฟ้า ความกว้างรวมแถบสีฟ้ากับเขตปลอดภัยอย่างน้อย 4 m สำหรับลู่ 250 m ขึ้นไป และ 2.5 m สำหรับลู่สั้นกว่า</td>
</tr>
<tr>
<td>3.6.072 bis รั้วใน</td>
<td>สูงอย่างน้อย 120 cm เหนือระดับเขตปลอดภัย ติดตั้งถาวรที่ขอบในของเขตปลอดภัย (ยกเว้นเมื่อเขตปลอดภัยกับกลางสนามไม่มีระดับต่างหรือความลาดชันฉับพลัน ซึ่งสนามที่รับรองครั้งแรกหลัง 1 ม.ค. 2026 ต้องติดตั้งระหว่างการแข่ง) โปร่งใส มั่นคง ไม่มีส่วนยื่น ห้ามติดป้ายโฆษณา ขอบบนมีวัสดุหุ้ม รับแรงได้ 4 kN ที่จุดใดก็ได้สูงไม่เกิน 65 cm และ 1.5 kN เหนือ 65 cm ถึงขอบบน ผลคำนวณต้องรับรองโดยวิศวกรโครงสร้างและส่งในขั้นขอรับรองก่อนติดตั้งลู่ ช่องว่างทุกช่องรวมใต้รั้วต้องน้อยกว่า 1 cm จุดที่เขตปลอดภัยสูงกว่ากลางสนามตั้งแต่ 1.5 m ต้องมีตาข่ายหรือแผงเพิ่ม และสนามที่รับรองครั้งแรกหลัง 1 ม.ค. 2026 ต้องมีรั้วในสูงอย่างน้อย 2 m ที่จุดนั้น ช่วงเปลี่ยนความสูงรั้วเอียงไม่เกิน 45°</td>
</tr>
<tr>
<td>3.6.073 หน้าตัด</td>
<td>หน้าตัดผิวลู่ทุกตำแหน่งต้องเป็นเส้นตรง ที่โค้งเอียง ขอบในควรโค้งต่อเข้าแถบสีฟ้า (3.6.073 bis) เหนือผิวลู่และเขตปลอดภัยต้องมีที่ว่างตั้งฉากกับผิวอย่างน้อย 3 m</td>
</tr>
<tr>
<td>3.6.074 ผิวลู่</td>
<td>ราบ เนื้อเดียวกัน ไม่ขัดสี ความเรียบคลาดได้ 5 mm ใน 2 m รับแรงได้อย่างน้อย 5 kN ที่จุดใดก็ได้ (ผลคำนวณรับรองโดยวิศวกรโครงสร้าง) ทำจากไม้ คอนกรีต หรือแอสฟัลต์ วัสดุอื่นต้องยื่นเอกสารให้ UCI อนุมัติ ผิวเคลือบต้องสม่ำเสมอทั้งลู่</td>
</tr>
<tr>
<td>3.6.076–3.6.078 การตีเส้นและโฆษณา</td>
<td>สีหรือวัสดุตีเส้นต้องไม่ลื่นและไม่เปลี่ยนการยึดเกาะของผิว เส้นตามยาวกว้าง 5 cm เส้นตั้งฉากกว้าง 4 cm และห้ามตีในเขตปลอดภัยหรือแถบสีฟ้า โฆษณาบนผิวลู่อยู่เหนือเส้น stayer ในแถบห่างเส้น stayer 50 cm ถึงห่างรั้ว 50 cm ห้ามอยู่ภายใน 1 m จากเส้น pursuit และเส้น 200 m หรือภายใน 3 m จากเส้นชัย</td>
</tr>
<tr>
<td>3.6.079 เส้นวัด</td>
<td>สีดำบนพื้นสีอ่อนหรือสีขาวบนพื้นสีเข้ม ห่างขอบในของลู่ 20 cm ทำเครื่องหมายทุก 5 m ตัวเลขทุก 10 m วัดที่ขอบในของเส้น</td>
</tr>
<tr>
<td>3.6.080 เส้น sprinter</td>
<td>สีแดง ห่างขอบในของลู่ 85 cm วัดถึงขอบในของเส้นสีแดง (เส้นกว้าง 5 cm ขอบนอกจึงอยู่ที่ 90 cm ตรงกับคู่มือรัฐ WA)</td>
</tr>
<tr>
<td>3.6.081 เส้น stayer</td>
<td>สีฟ้า ห่างขอบในเท่ากับค่ามากกว่าระหว่าง 1/3 ของความกว้างลู่กับ 2.45 m วัดถึงขอบในของเส้น</td>
</tr>
<tr>
<td>3.6.082–3.6.084 bis เส้นตั้งฉาก</td>
<td>เส้นชัยอยู่ช่วงท้ายทางตรงก่อนเข้าโค้งหลายเมตร เส้นดำกว้าง 4 cm กึ่งกลางแถบขาว 72 cm (ขาวข้างละ 34 cm) และต่อขึ้นไปถึงขอบบนของรั้ว เส้น 200 m สีขาว เส้น pursuit สีขาวยาว 4 m สองเส้นที่กึ่งกลางทางตรง เครื่องหมายตำแหน่งออกตัว Team Pursuit และ Team Sprint ห่างเส้น pursuit 11 cm</td>
</tr>
<tr>
<td>3.6.085 ทางเข้า</td>
<td>กลางสนามต้องเข้าถึงได้ทางอุโมงค์อย่างน้อยหนึ่งอุโมงค์</td>
</tr>
<tr>
<td>3.6.087 รั้วนอก</td>
<td>สูงอย่างน้อย 140 cm เหนือผิวลู่ (สนามที่รับรองครั้งแรกหลัง 1 ก.ค. 2025) ด้านในเรียบไม่มีส่วนยื่น รับแรง 4 kN ที่ความสูงไม่เกิน 65 cm และ 1.5 kN เหนือ 65 cm (รับรองโดยวิศวกรโครงสร้าง) จุดที่พื้นด้านนอกต่ำกว่าขอบนอกลู่ตั้งแต่ 1.5 m ต้องมีมาตรการป้องกันเพิ่ม และสนามที่รับรองครั้งแรกหลัง 1 ม.ค. 2026 ต้องมีรั้วนอกสูงอย่างน้อย 2 m ที่จุดนั้น ช่วงเปลี่ยนความสูงเอียงไม่เกิน 45° สีรั้วต้องตัดกับสีลู่ ถ้าเป็นวัสดุโปร่งใสทั้งหมด ส่วนล่างสูง 65 cm ต้องทึบ ประตูเปิดออกด้านนอก</td>
</tr>
<tr>
<td>3.6.090 แสงสว่าง</td>
<td>ไฟฉุกเฉินอย่างน้อย 100 lux นาน 5 นาที ทำงานทันที ฝึกซ้อมไม่มีผู้ชมแสงแนวตั้งเฉลี่ยคงสภาพอย่างน้อย 300 lux แข่งขัน Category A อย่างน้อย 1,000 lux Category B อย่างน้อย 500 lux World Cup ชิงแชมป์โลก ชิงแชมป์ทวีป และโอลิมปิกอย่างน้อย 1,400 lux กระจายสม่ำเสมอ โคมต้องไม่ทำให้แสงจ้าต่อผู้แข่ง ผู้ชม และการถ่ายทอด</td>
</tr>
<tr>
<td>3.6.093 bis แท่นผู้ปล่อยตัว</td>
<td>กลางสนามในแนวเส้น pursuit พื้นที่ 3–4 m² ยกสูงกว่าระดับลู่ให้มองเห็นเส้น pursuit ทั้งสองเส้น</td>
</tr>
<tr>
<td>3.6.094 ประเภทสนาม</td>
<td>ฉบับ 2026 เหลือสองประเภท: Category A เป็นสนามในร่มและลู่ 250 m เท่านั้น Category B เป็นสนามในร่ม มีหลังคา หลังคายื่น หรือกลางแจ้ง</td>
</tr>
<tr>
<td>3.6.095 เกณฑ์เรขาคณิต</td>
<td>ทุกลู่ต้องออกแบบให้ความเร็วปลอดภัยต่ำสุดอย่างน้อย 85 km/h ลู่ 250 m รัศมีโค้ง 19–25 m กว้าง 7–8 m ลู่ 285.714 m รัศมี 22–28 m กว้าง 7–8 m ลู่ 333.33 m รัศมี 25–35 m กว้าง 7–9 m ลู่ 400 m รัศมี 28–50 m กว้าง 7–10 m</td>
</tr>

<h3 id="c22-s2">22.2 เรขาคณิตขั้นสูง</h3>
<ul>
<li><strong>ผิวลู่เป็นผิวเส้นตรง (ruled surface)</strong> เพราะมาตรา 3.6.073 บังคับให้หน้าตัดเป็นเส้นตรง บทความจำลองผิวลู่เป็น X(s, v) = α(s) + v·γ(s) โดย α คือเส้นอ้างอิงตามแนวลู่ และ γ คือเวกเตอร์ทิศหน้าตัดที่หมุนตามมุมเอียง φ(s)</li>
<li><strong>โค้งต่อ (transition)</strong> ระหว่างทางตรงกับโค้งวงกลมรัศมี R ใช้ได้หลายแบบ แบบ clothoid (Euler spiral) ความโค้งเพิ่มเชิงเส้น κ(s) = s/(R·L) เมื่อ L คือความยาวโค้งต่อ แบบ Bloss (กำลังสาม) และแบบ Watorek (กำลังห้า) ทำให้ความโค้งเปลี่ยนนุ่มนวลกว่า มุมเอียงเปลี่ยนตามได้แบบคงที่ เชิงเส้น ไซน์ หรือกำลังสาม</li>
<li><strong>การปิดรอบ</strong> หาความยาวแต่ละช่วงด้วยการหาค่าต่ำสุด (Nelder-Mead) ให้ความยาวตามเส้นวัดเท่ากับความยาวกำหนดพอดีและเส้นอ้างอิงปิดเป็นวง ระเบียบ UCI 2026 มาตรา 3.6.095 กำหนดรัศมีโค้ง 19–25 m สำหรับลู่ 250 m ตัวอย่างลู่ 250 m ของบทความมีมุมเอียงประมาณ 12° ที่ทางตรง และ 45–46° ที่โค้ง ซึ่งเป็นตัวอย่างการออกแบบ ไม่ใช่ค่าบังคับของ UCI</li>
<li><strong>ตัวอย่างประมาณการ (ไม่ใช่วิธีออกแบบ):</strong> ถ้าไม่มีโค้งต่อ ลู่ 250 m ที่มีโค้งครึ่งวงกลม R 23 m ต้องมีทางตรงช่วงละ (250 − 2π × 23)/2 = 52.74 m และมุมเอียงสมดุลไม่คิดแรงเสียดทาน tan θ = v²/(gR) ที่ v 20 m/s (72 km/h) ได้ θ = 60.6° ซึ่งสูงกว่ามุมจริงประมาณ 45° เพราะแรงเสียดทานยางรับแรงด้านข้างส่วนหนึ่ง และลู่จริงต้องมีโค้งต่อ (คำนวณ ตรวจด้วยสคริปต์แล้ว)</li>
</ul>
<figure class="widget-card"><div class="widget" data-w="16a22306-7c28" aria-label="ลู่จักรยาน 250 m แบบย่อสามมิติ"></div><figcaption><span>ลู่จักรยาน 250 m แบบย่อสามมิติ</span><em>ลากเพื่อหมุน 360°</em></figcaption></figure>
<p>แบบสามมิตินี้วาดจากค่าในหัวข้อ 22.1–22.2 รูปลู่เป็นแบบย่อ (ตีความ) ป้ายในสนามเลื่อนตามมุมมอง ป้ายที่จะทับกันในบางมุมจะซ่อนชั่วคราวและกลับมาเมื่อหมุนต่อ</p>
<h3 id="c22-s3">22.3 โครงสร้าง</h3>
<p>ระเบียบ UCI 2026 มาตรา 3.6.066 ระบุว่าการรับรองสนามของ UCI ไม่ครอบคลุมความมั่นคงทางโครงสร้าง ซึ่งต้องเป็นไปตามกฎหมายก่อสร้างของประเทศและเป็นความรับผิดชอบของเจ้าของและวิศวกร</p>
<p><strong>ค่าที่วิศวกรโครงสร้างต้องใช้โดยตรง:</strong></p>
<ul>
<li>ผิวลู่รับแรงอย่างน้อย 5 kN ที่จุดใดก็ได้ (3.6.074)</li>
<li>รั้วในและรั้วนอกรับแรง 4 kN ที่ความสูงไม่เกิน 65 cm และ 1.5 kN เหนือ 65 cm (3.6.072 bis และ 3.6.087)</li>
<li>ผลคำนวณทั้งหมดต้องรับรองโดยวิศวกรโครงสร้างและส่งในขั้นขอรับรองก่อนติดตั้งลู่</li>
<li>ระเบียบไม่กำหนดค่าการโก่งตัวหรือระบบโครงรองรับ</li>
</ul>
<p><strong>การคุมงานก่อสร้าง:</strong> ความเรียบ 5 mm ใน 2 m บนผิวเอียงและที่ว่างเหนือผิวลู่อย่างน้อย 3 m (3.6.073 bis) เป็นเกณฑ์ควบคุมงานก่อสร้างที่เข้มงวด ผิวลู่ที่มีมุมเอียงถึงประมาณ 45° ต้องออกแบบโครงสร้างรองรับให้ได้รูปผิวเส้นตรงตามมาตรา 3.6.073 ทุกหน้าตัด โครงรองรับแต่ละแนวจึงต้องวางตามพิกัดที่คำนวณจากแบบจำลองเรขาคณิต และต้องคุมความคลาดเคลื่อนการก่อสร้างอย่างเข้มงวด</p>
<p>งานนี้ต้องมีผู้ออกแบบลู่เฉพาะทางและผ่านการรับรองสนาม (homologation) ของ UCI ส่วนฐานรากและอาคารคลุมออกแบบตามบทที่ 2 และมาตรฐานโครงสร้างที่ใช้บังคับ</p>
<p><strong>ขั้นตอนรับรองสนาม (homologation) ตามมาตรา 3.6.097–3.6.101 ฉบับ 2026 (ตรวจจากหน้า 105–106 ของไฟล์ต้นฉบับ)</strong> มาตรา 3.6.096 เดิมที่ให้สหพันธ์แห่งชาติเป็นผู้ยื่นถูกยกเลิกเมื่อ 1 ม.ค. 2026 ขั้นตอนที่มีผลคือ</p>
<ol>
<li>ยื่นคำขอต่อ UCI อย่างน้อย 2 เดือนก่อนวันตรวจ ด้วยแบบคำขอรับรองและแฟ้มเทคนิคตามแบบมาตรฐานของ UCI สหพันธ์แห่งชาติของประเทศที่ตั้งสนามต้องรับทราบและมีส่วนร่วม UCI ขอเอกสารเพิ่มได้ (3.6.097)</li>
<li>ผู้ยื่นจัดการตรวจสนามต่อหน้าผู้เชี่ยวชาญที่รับผิดชอบการวัดตามระเบียบ ภายใต้การกำกับของผู้แทน UCI และต้องมีกลุ่มนักปั่นทดลองลู่ ค่าใช้จ่ายการตรวจเป็นของผู้ยื่น โดยสหพันธ์แห่งชาติรับผิดร่วม (3.6.098)</li>
<li>ผู้แทน UCI ทำรายงานตรวจโดยละเอียด ผู้วัดสนามและผู้แทนสหพันธ์แห่งชาติลงนามร่วม (3.6.099)</li>
<li>ถ้า UCI เห็นประเด็นที่อาจไม่รับรอง ต้องให้ผู้ยื่นชี้แจงก่อน หากไม่รับรอง สหพันธ์ที่เกี่ยวข้องอุทธรณ์ต่อ CAS ได้ (3.6.100)</li>
<li>การเปลี่ยนแปลงหรือปรับปรุงสนามหลังการตรวจทำให้การรับรองสิ้นผล ต้องขอรับรองใหม่ตามขั้นตอนข้างต้นและ &quot;UCI homologation procedure&quot; บนเว็บ UCI (3.6.101)</li>
</ol>
<p>แบบคำขอ แบบมาตรฐานแฟ้มเทคนิค และเอกสาร UCI homologation procedure ยังค้นไม่พบฉบับเปิดสาธารณะ ต้องขอจาก UCI ผ่านสหพันธ์แห่งชาติก่อนเริ่มออกแบบ</p>

</table></div><h3 id="c25-s2">ข้อจำกัดของการตรวจ</h3>
<ul>
<li><strong>ฟุตบอล:</strong> กฎข้อ 1 เทียบกับไฟล์ PDF Laws of the Game 2026/27 ของ IFAB แล้วเมื่อ 23 ต.ค. 2026 ค่ามิติตรงกันทุกค่า และฉบับนี้ไม่มีคำว่า International Match Standard แล้ว (ตัดออกจากหัวข้อ 3.1) ส่วนฟุตซอลเทียบกับ PDF ฉบับเต็มของ FIFA แล้ว</li>
<li><strong>แบดมินตัน:</strong> Diagram A เทียบจากไฟล์ BWF Laws of Badminton (29 พ.ค. 2023 Version 2.1) แล้วเมื่อ 23 ต.ค. 2026 ทุกขนาดตรงกับตาราง 5.2</li>
<li><strong>เบสบอล:</strong> ตาราง 2.1.3 และแผนภาพภาคผนวก 4 ของ WBSC 2025-2026 อ่านครบจากไฟล์แล้วเมื่อ 23 ต.ค. 2026 ส่วนไฟล์ OBR 2025 บนเว็บ MLB ปิดกั้นการเข้าถึงอัตโนมัติ</li>
<li><strong>เปตอง:</strong> กติกาฉบับนิวซีแลนด์แยกกฎท้องถิ่นด้วยสี จึงเทียบกับฉบับภาษาฝรั่งเศส 2021 แล้ว ค่าทุกค่าตรงกัน</li>
<li><strong>ตะกร้อและสนามแข่งรถ:</strong> กติกาตะกร้อเป็นฉบับ 2013 ไม่พบฉบับใหม่กว่า ส่วน Appendix O ฉบับ 2024 เป็นฉบับที่ใช้ปี 2025</li>
<li><strong>บาสเกตบอล:</strong> เทียบกติกา FIBA 2026 ฉบับเต็มและ Basketball Equipment 2026 ครบแล้วเมื่อ 23 ต.ค. 2026</li>
<li><strong>ค่าที่คำนวณ:</strong> ทุกค่าในเล่มตรวจซ้ำด้วยสคริปต์ Python เมื่อ 22 ต.ค. 2026 ไม่พบข้อผิดพลาด</li>
<li><strong>มาตรฐานไทย:</strong> ที่เปิดตรวจแล้วมี พ.ร.บ.ควบคุมอาคาร พ.ศ. 2522 (นิยามอาคาร) กฎกระทรวงกำหนดสิ่งอำนวยความสะดวกในอาคารฯ พ.ศ. 2548 แก้ไขฉบับที่ 2 พ.ศ. 2564 และกฎกระทรวงการออกแบบโครงสร้างอาคาร พ.ศ. 2566 (หัวข้อ 2.7 ฉบับหลังอ่านจากข้อความที่สกัดจาก PDF ซึ่งมีตัวอักษรแตก) ยังไม่ได้เปิด มอก. มาตรฐาน วสท. และกฎกระทรวงด้านอัคคีภัย ทางหนีไฟ และแรงแผ่นดินไหว</li>
<li><strong>บทที่ 17–22:</strong> บทลู่จักรยาน (ระเบียบ UCI ฉบับ 1 ม.ค. 2026) และ FIG Apparatus Norms ฉบับ 2026 ตรวจจากไฟล์ต้นฉบับที่ผู้ใช้ส่งมาแล้ว EN 14974:2019 เปิดได้เพียงหน้าตัวอย่าง หน้านิยามของ R&amp;A และหน้า Laws บนเว็บ MCC ปิดกั้นการเข้าถึงอัตโนมัติ (ใช้ PDF กติกาฉบับเต็มของ MCC และอภิธานศัพท์ของ IGF แทน) และเอกสาร ECB ไม่ระบุปีพิมพ์</li>
<li><strong>อ่านผ่านสำเนาหรือแหล่งรอง (รอบค้นเพิ่ม 22 ต.ค. 2026):</strong> FIFA Code of Practice 2023 (สำเนาบน readkong) ค่ากราฟ IDF ของกรมชลประทาน (ยกมาจากงานวิจัย) แนวทางราคากลาง 2569 (ข่าวบนเว็บโยธาไทย) และ EN 14974 (ข้อความตัวอย่างบน iTeh) ควรเทียบกับต้นฉบับก่อนใช้ในสัญญา</li>
</ul>
<h3 id="c25-s3">รายการข้อมูลที่ยังยืนยันไม่ได้</h3>
<p>รายการนี้ปรับล่าสุดเมื่อ 23 ต.ค. 2026 หลังเปิดไฟล์ต้นฉบับที่ได้รับเพิ่ม (BWF, World Rugby, WBSC, FIA Appendix H) ข้อที่แก้ได้ถูกเติมลงในบทที่เกี่ยวข้องแล้ว เหลือเฉพาะส่วนที่ยังหาต้นฉบับไม่ได้หรือสหพันธ์ไม่ได้กำหนด พร้อมเหตุผล</p>
<ol>
<li><strong>เกณฑ์สนามของสมาคมกีฬาฟุตบอลแห่งประเทศไทย (ระบบใบอนุญาตสโมสร):</strong> ค้นไม่พบฉบับที่เปิดอ่านได้ (เพิ่ม AFC Stadium Regulations 2026 ในหัวข้อ 3.1 แทน ซึ่งก็ไม่กำหนดขนาดสนามระดับฝึกซ้อม)</li>
<li><strong>ค่าคลาดเคลื่อนตำแหน่งเส้น ความลาดผิวสนาม และความหนาชั้นวัสดุ:</strong> เพิ่มได้แล้วสำหรับหญ้าเทียมฟุตบอล (3.8) หญ้าเทียมรักบี้ (10.5) สนามสเกตบอร์ด (19.2) และลู่จักรยาน (22.1) สนามอื่นยังไม่พบค่าตัวเลขในเอกสารสหพันธ์ที่เปิดอ่านได้ (บางฉบับ เช่น เอกสารสนามของ ITF และ IHF Guidelines for Playing Courts and Goals ยังไม่ได้เปิด) ต้องมาจากผู้ออกแบบและมาตรฐานแห่งชาติ</li>
<li><strong>คู่มือทดสอบที่ไม่เปิดสาธารณะ:</strong> FIBA Handbook of Test Methods and Requirements และ FIFA Handbook สำหรับพื้นฟุตซอล (หน้าเว็บไม่มีไฟล์) หลักการพื้นไม้แบบสปริงจาก FIBA Venue Guide เพิ่มในหัวข้อ 6.7 แล้ว แต่ไม่มีขนาดคานรองหรือความหนาวัสดุ</li>
<li><strong>รายชื่อผลิตภัณฑ์รับรองของ World Athletics และ World Rugby และระบบรับรองวัสดุตีเส้นสำหรับสนามทั่วไป:</strong> ไม่พบในรอบนี้ (รายชื่อที่พบอยู่ในหัวข้อ 2.8)</li>
<li><strong>กราฟ IDF ทางการฉบับเต็ม (กรมชลประทาน 59 ชุด):</strong> ไม่พบฉบับเปิดออนไลน์ ใส่ค่าตัวอย่างจากงานวิจัยไว้ในหัวข้อ 2.4</li>
<li><strong>กฎกระทรวงด้านอัคคีภัยและทางหนีไฟ (เช่น ฉบับที่ 55 พ.ศ. 2543 แก้ไขโดยฉบับที่ 61) กฎกระทรวงแรงแผ่นดินไหว มอก. และมาตรฐาน วสท.:</strong> ยังไม่พบข้อความเต็มที่เปิดอ่านได้ และยังไม่พบข้อกำหนดที่นั่งเก้าอี้ล้อเฉพาะอัฒจันทร์ (กฎกระทรวงการออกแบบโครงสร้าง พ.ศ. 2566 เพิ่มในหัวข้อ 2.7 แล้ว)</li>
<li><strong>ราคาต่อหน่วย:</strong> ราคาทางการประกาศรายเดือนและรายจังหวัด จึงไม่ใส่ตัวเลขในเล่ม ตารางราคาของกระทรวงพาณิชย์ไม่แสดงข้อมูลขณะตรวจ และแนวทางราคากลาง 2569 ฉบับเต็มยังไม่ได้เปิด (แหล่งทางการอยู่ท้ายบทที่ 24)</li>
<li><strong>EN 14974:2019 ข้อ 6.2.6, 6.3 และ 6.4 ฉบับเต็ม (ความกว้างแท่น ทางลาด ตารางมวล):</strong> มาตรฐานจำหน่าย ข้อความตัวอย่างหยุดที่ข้อ 6.2.1 ส่วนความหนาแผ่นคอนกรีตและเหล็กเสริมมาตรฐานไม่กำหนด (กำลังคอนกรีต C35/45 และแรงออกแบบเพิ่มในหัวข้อ 19.2 แล้ว)</li>
<li><strong>แบบคำขอรับรอง แบบมาตรฐานแฟ้มเทคนิค และเอกสาร UCI homologation procedure:</strong> ไม่พบฉบับเปิดสาธารณะ ต้องขอผ่านสหพันธ์แห่งชาติ (ขั้นตอนตามมาตรา 3.6.097–3.6.101 เพิ่มในหัวข้อ 22.3 แล้ว)</li>
<li><strong>ชั้นรองใต้ทรายสนามวอลเลย์บอลชายหาด:</strong> FIVB ไม่กำหนด คู่มือ Volleyball Canada ที่พบไม่ให้ขนาดท่อ ระยะห่างท่อ หรือความหนากรวด (หัวข้อ 20.3)</li>
<li><strong>แผนภาพผังแทรมโพลีนของ FIG (หน้า 156):</strong> ไม่ระบุหน่วยและจุดอ้างอิงของมิติ 1,600 ส่วนแรงออกแบบจุดยึด FIG ไม่กำหนด มีเฉพาะแรงทดสอบ 8,000 N (ผัง MAG/WAG ถอดมิติแล้วในหัวข้อ 21.6)</li>
<li><strong>ระบบชลประทานสนามกอล์ฟ:</strong> ไม่มีมาตรฐานตัวเลขของ USGA หรือ R&amp;A ใส่ข้อมูลสำรวจ GCSAA 2020 ในสหรัฐฯ ไว้เทียบลำดับขนาดในหัวข้อ 18.4</li>
</ol>

าสหพันธ์ไม่ได้กำหนดค่าใด หรือเปิดเอกสารต้นฉบับไม่ได้ หนังสือจะเขียนว่ายังไม่มีข้อมูล แทนการเดาค่าให้ดูครบ"},{"c":0,"s":"c0-s3","t":"ใครควรอ่าน และอ่านอย่างไร","x":"หนังสือเล่มนี้เขียนให้วิศวกรโยธา ผู้ออกแบบ นักศึกษา เจ้าของโครงการ และผู้ดูแลสนาม ใช้เป็นจุดเริ่มต้นก่อนเปิดกติกาฉบับเต็มของแต่ละกีฬา ผู้อ่านที่เพิ่งเริ่มควรอ่านบทที่ 1 และ 2 ก่อน เพราะเป็นกรอบที่ทุกบทใช้ร่วมกัน จากนั้นเลือกอ่านเฉพาะกีฬาที่สนใจได้เลย แต่ละบทอ่านจบในตัว ส่วนผู้ที่กำลังทำโครงการจริง ควรใช้ตารางพิกัดคู่กับต้นฉบับของสหพันธ์ฉบับล่าสุด"},{"c":0,"s":"c0-s4","t":"ข้อควรระวัง","x":"ไม่ใช่แบบก่อสร้าง หนังสือเล่มนี้ไม่ใช้แทนการออกแบบและลงนามรับรองโดยวิศวกรผู้ได้รับใบอนุญาต ข้อความที่ไม่ได้อ้างแหล่งข้อกำหนดคือหลักการวิศวกรรมทั่วไป ไม่ใช่ข้อกำหนดของมาตรฐานใด กติกาเปลี่ยนได้ สหพันธ์หลายแห่งปรับกติกาทุกปีหรือทุกฤดูกาล ก่อนใช้ค่าใดในสัญญาหรือแบบก่อสร้าง ให้ตรวจกับฉบับที่มีผลอยู่ในวันนั้น ภาพสามมิติใช้เพื่อเรียนรู้ ภาพช่วยให้เห็นตำแหน่งและสัดส่วน แต่ไม่ใช่แบบตามมาตราส่วนสำหรับก่อสร้าง ค่าที่ขึ้นกับพื้นที่ เช่น ความหนาชั้นวัสดุ ความลาดเอียง และการระบายน้ำ ต้องออกแบบจากผลสำรวจดินและข้อกำหนดของโครงการเสมอ หวังว่าหนังสือเล่มนี้จะช่วยให้การวางผังและก่อสร้างสนามกีฬาในประเทศไทยแม่นยำขึ้น และช่วยลดเวลาที่ต้องตามหาตัวเลขจากเอกสารหลายสิบฉบับ หากพบค่าที่ไม่ตรงกับต้นฉบับฉบับใหม่ ให้ยึดต้นฉบับเป็นหลัก จัดทำโดย นายกฤช เดชมี และ นายกิม ลีลาพงศ์ ฉบับปรับปรุง 23 ต.ค. 2026"},{"c":0,"s":"c0-s5","t":"บันทึกการตรวจและการแก้ไข","x":"ทุกตัวเลขสำคัญในเล่มตรวจย้อนถึงเอกสารต้นฉบับได้ ไม่มีตัวเลขใดเติมจากความจำ ฉบับนี้รวมเนื้อหาทั้งหมดของไฟล์ฉบับ 20 ต.ค. 2026 แล้วเขียนบทที่ค้างต่อ ข้อความที่ไม่ได้อ้างแหล่งข้อกำหนดคือหลักการวิศวกรรมทั่วไป ไม่ใช่ข้อกำหนดของมาตรฐานใด หนังสือเล่มนี้ไม่ใช้แทนการออกแบบและลงนามรับรองโดยวิศวกรผู้ได้รับใบอนุญาต การแก้ไขจากไฟล์เดิม: ตารางสถานะเดิม (บทที่ 1 และหน้าสถานะท้ายเล่ม) ระบุว่าบทที่ 4, 6 และ 10 \"ยังไม่เริ่ม\" ทั้งที่มีเนื้อหาแล้ว ฉบับนี้แก้ตารางสถานะในบทที่ 1 แล้ว บรรณานุกรมเดิมยังไม่มี ITF, FIBA และ World Rugby ฉบับนี้รวมแหล่งอ้างอิงทั้งหมดไว้ท้ายเล่ม การตรวจรอบ 22 ต.ค. 2026: เปิดเอกสารต้นฉบับใหม่จากแหล่งอื่นที่เปิดได้ แล้วปรับเนื้อหาตามต้นฉบับ บทที่ปรับ: ฟุตซอลทั้งบท (FIFA Futsal Laws 2025-26 ฉบับเต็ม) เปตองทั้งบท (FIPJP 2021 ฉบับฝรั่งเศส) เบสบอล (WBSC 2025-2026) หญ้าเทียมฟุตบอล (FIFA Test Manual 2024) และอุปกรณ์-อาคารบาสเกตบอล (FIBA Equipment 2024) ค่าที่ผิดหรือล้าสมัย แก้แล้ว 5 จุด: เครื่องหมายระยะถอยข้างจุด 10 m ของฟุตซอลเป็นวงกลมรัศมี 4 cm (เดิมเขียนกว้าง 8 cm) ประตูฟุตซอลห้ามยึดติดพื้น เกณฑ์หญ้าเทียมใช้ฉบับ 2024 แทน 2015 ระยะรั้ว 375 ft ของ WBSC เป็นค่าเก่า ฉบับปัจจุบันคือ 325 ft กติกาสีเส้นบาสเกตบอลเปลี่ยนตาม FIBA 2026 ค่าที่คำนวณ: ทุกค่าในเล่มคำนวณซ้ำด้วยสคริปต์ Python แล้ว ไม่พบข้อผิดพลาด ส่วนที่ยังยืนยันจากต้นฉบับไม่ได้ (สหพันธ์ไม่ได้เขียนไว้หรือเปิดเอกสารไม่ได้) รวบไว้ในรายการท้ายเล่ม การตรวจรอบ 23 ต.ค. 2026: ตรวจเลขคำนวณ ความสอดคล้องข้ามบท และป้ายในภาพสามมิติทั้งเล่มอีกครั้ง ไม่พบตัวเลขผิด แก้ข้อความที่ขัดกันระหว่างบท เปลี่ยนบทบาสเกตบอลเป็น FIBA 2026 ฉบับเต็ม เทียบกฎข้อ 1 กับ PDF ของ IFAB และเพิ่มรายการตรวจส่งมอบของเทนนิสและรักบี้ จากนั้นเทียบกับไฟล์ต้นฉบับที่ได้รับเพิ่ม 4 ฉบับ (BWF Laws V2.1, World Rugby Laws 2026, WBSC 2025-2026 และ FIA Appendix H 2026) แล้วเติมค่าลงในบทที่ 5, 7, 10 และ 12"},{"c":1,"s":"c1","t":"บทที่ 1 บทนำ ขอบเขต หน่วย และลำดับชั้นของมาตรฐาน","x":"ขนาดสนามที่ถูกต้องมาจากกติกาของสหพันธ์กีฬา ส่วนวิธีสร้างให้ได้ขนาดและใช้งานได้ปลอดภัยมาจากหลักวิศวกรรมโยธาและกฎหมายท้องถิ่น สองเรื่องนี้อยู่ในเอกสารคนละชุด และต้องไม่นำมาปนกัน บท หัวข้อ 1 บทนำ ขอบเขต หน่วย ลำดับชั้นของมาตรฐาน 2 หลักวิศวกรรมโยธาที่ใช้ร่วมกัน 3 สนามฟุตบอล 11 คน 4 เทนนิส 5 แบดมินตัน 6 บาสเกตบอล 7–9 เบสบอล เปตอง ฟุตซอล 10 รักบี้ 11–13 เซปักตะกร้อ สนามแข่งรถ สระว่ายน้ำ 14–22 กรีฑา ฮอกกี้ วอลเลย์บอลและแฮนด์บอล คริกเก็ต กอล์ฟ สเกตบอร์ด วอลเลย์บอลชายหาด ยิมนาสติก จักรยานลู่ 23–24 ตารางเปรียบเทียบ ตัวอย่างคำนวณ BOQ"},{"c":1,"s":"c1-s1","t":"1.1 ลำดับชั้นของข้อกำหนด","x":"ชั้น แหล่ง ตัดสินเรื่อง ตัวอย่างในบทสนามฟุตบอล 1 กติกาของสหพันธ์กีฬา ขนาดพื้นที่เล่น เส้น อุปกรณ์ IFAB Laws of the Game กฎข้อ 1 2 ข้อกำหนดหรือคู่มือทางเทคนิคของสหพันธ์ พื้นที่รอบสนาม พื้นผิว การรับรอง FIFA Football Stadiums Guidelines 3 มาตรฐานวิศวกรรมและกฎหมายไทย โครงสร้าง ดิน ความปลอดภัย การเข้าถึง เปิดตรวจกฎหมายแล้ว 3 ฉบับ (หัวข้อ 2.7) มอก. และ วสท. ยังไม่ได้ตรวจ 4 ข้อกำหนดของเจ้าของงานและรายการประกอบแบบ ระดับคุณภาพ เกณฑ์ตรวจรับ เป็นรายโครงการ ชั้นที่ 1 ใช้ตัดสินว่าสนามถูกต้องตามกติกาหรือไม่ ส่วนชั้นที่ 2 หลายข้อเป็นเพียง \"ข้อแนะนำ\" ไม่ใช่ข้อบังคับ เล่มนี้แยกสองอย่างนี้ไว้ชัดเสมอ"},{"c":1,"s":"c1-s2","t":"1.2 พื้นที่เล่นกับพื้นที่ก่อสร้าง","x":"มิติที่ต้องแยกกันทุกครั้งมี 3 ระดับ พื้นที่เล่น (field of play): ขอบเขตที่กติกากำหนด วัดถึงเส้น พื้นที่ผิวสนามขยาย: พื้นผิวเดียวกับสนามที่ยื่นออกไปรอบ ๆ เพื่อความปลอดภัยของผู้เล่น พื้นที่ก่อสร้างรวม: รวมระบบระบายน้ำ ทางเดิน รั้ว และงานประกอบ ขึ้นกับโครงการ"},{"c":1,"s":"c1-s3","t":"1.3 หน่วยและการแปลง","x":"ใช้ระบบ SI เป็นหลัก กติกาหลายฉบับให้ค่าเป็นหลาและนิ้วด้วย ใช้ตัวคูณที่นิยามแน่นอน หน่วยเดิม ค่าเป็น SI 1 หลา (yd) 0.9144 m 1 ฟุต (ft) 0.3048 m 1 นิ้ว (in) 25.4 mm ตัวอย่าง: 12 ซม. ในกติกาฟุตบอลเท่ากับ 4.72 นิ้ว แต่กติกาเขียนในวงเล็บว่า 5 นิ้ว ค่าหลา/นิ้วในวงเล็บของกติกาจึงเป็นค่าประมาณ งานสำรวจให้ยึดค่าเมตริก ไม่ใช้ค่าที่แปลงกลับจากหลา"},{"c":1,"s":"c1-s4","t":"1.4 วิธีอ่านข้อกำหนดในเล่ม","x":"ทุกค่าที่เป็นข้อกำหนดจะมีแหล่งอ้างอิงกำกับ ค่าที่ขึ้นกับสภาพพื้นที่ เช่น ความหนาชั้นวัสดุ ความลาดเอียงระบายน้ำ จะไม่ถูกกำหนดเป็นค่าตายตัว แต่ระบุว่า \"ต้องออกแบบและตรวจสอบเพิ่มเติม\""},{"c":2,"s":"c2","t":"บทที่ 2 หลักวิศวกรรมโยธาที่ใช้ร่วมกัน","x":"บทนี้อธิบายหลักการและสูตรมาตรฐานของตำราวิศวกรรม ไม่มีค่าเกณฑ์ยอมรับของสนามใดสนามหนึ่ง ค่าสัมประสิทธิ์ ปริมาณฝน และเกณฑ์การบดอัดที่ใช้จริงต้องมาจากมาตรฐานและผลสำรวจของโครงการ ตัวเลขในตัวอย่างเป็นข้อมูลสมมติเพื่อการเรียนรู้เท่านั้น"},{"c":2,"s":"c2-s1","t":"2.1 ลำดับงานสำรวจและออกแบบพื้นที่","x":"สำรวจภูมิประเทศและทำแผนที่ระดับ ทิศทางการไหลของน้ำ และสิ่งกีดขวาง เจาะสำรวจดินและวัดระดับน้ำใต้ดิน จำนวนและความลึกหลุมเจาะกำหนดตามขนาดและความเสี่ยงของโครงการ ทดสอบดินในห้องปฏิบัติการ เช่น ขนาดคละ ขีดพิกัดเหลว ความหนาแน่นแห้งสูงสุด ออกแบบระดับสนาม ดินตัด ดินถม และชั้นรองพื้น ออกแบบระบบระบายน้ำผิวและใต้ผิว สภาพดินเป็นตัวแปรหลักของต้นทุน ดินเหนียวอ่อนมักต้องปรับปรุงดินหรือรอการทรุดตัว ส่วนดินทรายระบายน้ำดีแต่อาจต้องเพิ่มการบดอัดและการกักเก็บความชื้นของผิวสนาม"},{"c":2,"s":"c2-s2","t":"2.2 ปริมาณดินตัดและดินถม","x":"วิธีพื้นที่หน้าตัดเฉลี่ย (average end area) เมื่อ V คือปริมาตร (m³), A₁ และ A₂ คือพื้นที่หน้าตัดที่สองปลาย (m²), L คือระยะระหว่างหน้าตัด (m) ตัวอย่างสมมติ: A₁ = 12 m², A₂ = 18 m², L = 20 m → V = (12 + 18) / 2 × 20 = 300 m³ (ปริมาตรในสภาพธรรมชาติ ยังไม่คิดการหดหรือขยายตัวของดิน)"},{"c":2,"s":"c2-s3","t":"2.3 การบดอัด","x":"ความแน่นสัมพัทธ์ที่ตรวจในสนามเทียบกับการทดสอบบดอัดในห้องปฏิบัติการ เมื่อ γd,field คือความหนาแน่นแห้งที่วัดในสนาม และ γd,max คือค่าสูงสุดจากการทดสอบบดอัด (หน่วยเดียวกัน เช่น t/m³) ตัวอย่างสมมติ: γd,field = 1.80 t/m³, γd,max = 1.90 t/m³ → RC = 94.7% ว่าผ่านหรือไม่ผ่านต้องเทียบกับเกณฑ์ในรายการประกอบแบบของโครงการ ไม่มีค่ากลางที่ใช้ได้กับทุกโครงการ"},{"c":2,"s":"c2-s4","t":"2.4 การระบายน้ำ","x":"อัตราการไหลสูงสุดจากพื้นที่เล็กประมาณด้วยวิธีเหตุผล (Rational Method) ในหน่วย SI เมื่อ Q คืออัตราการไหล (m³/s), C คือสัมประสิทธิ์น้ำท่า (ไม่มีหน่วย), i คือความเข้มฝน (mm/h), A คือพื้นที่รับน้ำ (ha) ตัวอย่างสมมติ: A = 8,740 m² = 0.874 ha, C = 0.5, i = 100 mm/h → Q = 0.5 × 100 × 0.874 / 360 = 0.121 m³/s หรือประมาณ 121 L/s ค่า C และ i ข้างต้นเป็นเพียงตัวอย่าง ค่าที่ใช้จริงต้องมาจากข้อมูลฝนท้องถิ่น คาบการเกิดซ้ำที่เจ้าของงานกำหนด และชนิดผิวสนาม ความเร็วในท่อหรือรางที่ไหลเต็มตามสมการแมนนิง เมื่อ V คือความเร็ว (m/s), n คือสัมประสิทธิ์ความขรุขระ, R คือรัศมีชลศาสตร์ (m), S คือความลาดเอียงของท้องท่อ (m/m) ข้อมูลฝนออกแบบของไทย (รอบตรวจ 22 ต.ค. 2026): กราฟอ้างอิง: งานวิจัยไทยอ้างกราฟความเข้มฝน-ช่วงเวลา-ความถี่ (IDF) จากการวิเคราะห์ของกรมชลประทาน (Bumpenkit, 1999) เป็นมาตรฐาน มี 59 ชุดครอบคลุมทั้งประเทศ (ก่อนหน้านั้น Mustonen, 1969 เสนอไว้ 14 ชุด) ยังไม่พบรายงานฉบับเต็มของกรมชลประทานหรือกรมอุตุนิยมวิทยาที่เปิดอ่านออนไลน์ได้ ค่าตัวอย่างภาคกลาง: บทความ Temporal change of extreme precipitation intensity–duration–frequency relationships in Thailand (Journal of Water and Climate Change 13(2): 839, 2022) ยกค่าจากกราฟของกรมชลประทานไว้ เช่น ช่วง 1 ชั่วโมง คาบการเกิดซ้ำ 2 ปี = 48.4 คาบ 100 ปี = 100.8 และช่วง 15 นาที คาบ 2 ปี = 96.3 (ส่วนที่อ่านได้ไม่ระบุหน่วย น่าจะเป็น mm/h) แนวโน้ม: บทความเดียวกันเทียบกับสถานีวัดฝนอัตโนมัติ 49 สถานี (ส่วนใหญ่ปี 1990–2015) พบว่าความเข้มฝนสุดขีดส่วนใหญ่ไม่ได้สูงขึ้นจากกราฟเดิม ภาคกลางและภาคตะวันออกมีสัดส่วนค่าที่สูงขึ้นมากที่สุด (31 และ 34 จาก 81 ค่า) เทียบกับตัวอย่างข้างต้น: i = 100 mm/h อยู่ในลำดับเดียวกับฝน 1 ชั่วโมง คาบ 100 ปีของภาคกลาง การใช้งาน: ค่าเหล่านี้ใช้ดูลำดับขนาดเท่านั้น งานออกแบบจริงต้องขอกราฟ IDF ของสถานีใกล้โครงการจากกรมชลประทานหรือกรมอุตุนิยมวิทยา และใช้คาบการเกิดซ้ำตามที่เจ้าของงานกำหนด"},{"c":2,"s":"c2-s5","t":"2.5 โครงสร้างชั้นพื้นสนาม (หลักการ)","x":"ชั้น (จากล่างขึ้นบน) หน้าที่ ดินเดิมที่บดอัดแล้ว ถ่ายน้ำหนักลงสู่ดินและควบคุมการทรุดตัว ชั้นรองพื้นหรือชั้นกรอง แยกวัสดุและกระจายน้ำหนัก ชั้นระบายน้ำ พาน้ำที่ซึมลงมาไปสู่ท่อระบาย ชั้นปรับระดับ/ชั้นราก รองรับผิวสนามและปรับระดับให้เรียบ ผิวสนาม พื้นผิวเล่นจริง (หญ้า หญ้าเทียม แอสฟัลต์ อะคริลิก ฯลฯ) ชนิดวัสดุและความหนาของแต่ละชั้นต้องออกแบบและตรวจสอบเพิ่มเติม ตามผลสำรวจดิน ภาระใช้งาน ระบบระบายน้ำ และข้อกำหนดของผู้ผลิตหรือสหพันธ์ ไม่นำค่าของสนามหนึ่งไปใช้กับอีกสนามโดยไม่มีเหตุผลทางวิศวกรรม"},{"c":2,"s":"c2-s6","t":"2.6 การตรวจมุมฉากของผังสนาม","x":"สนามสี่เหลี่ยมผืนผ้าต้องมีเส้นทแยงมุมสองเส้นยาวเท่ากัน ความยาวคำนวณได้จาก ตัวอย่าง: L = 105 m, W = 68 m → d = √(11,025 + 4,624) = √15,649 = 125.10 m ค่าคลาดเคลื่อนที่ยอมรับได้ให้กำหนดตามข้อกำหนดโครงการและมาตรฐานที่บังคับใช้ เกณฑ์ปฐมภูมิที่พบมีเฉพาะหญ้าเทียมฟุตบอล คือตำแหน่งเส้น ±50 mm และแนวขอบสนาม ±25 mm (FIFA Code of Practice 2023 หัวข้อ 3.8)"},{"c":2,"s":"c2-s7","t":"2.7 กฎหมายอาคารของไทยที่เกี่ยวข้อง (เท่าที่เปิดตรวจ)","x":"รอบตรวจ 22 ต.ค. 2026 เปิดอ่านกฎหมายไทยได้ 3 ฉบับ คือสองฉบับแรกด้านล่าง และกฎกระทรวงการออกแบบโครงสร้าง พ.ศ. 2566 ท้ายหัวข้อ ที่ยังไม่ได้เปิดตรวจ: มอก. มาตรฐาน วสท. และกฎกระทรวงด้านอัคคีภัยและทางหนีไฟ (เช่น กฎกระทรวงฉบับที่ 55 พ.ศ. 2543 ซึ่งพบชื่อและการแก้ไขโดยกฎกระ
